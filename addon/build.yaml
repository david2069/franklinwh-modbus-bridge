---
# The Supervisor builds the add-on with addon/ as the Docker build context, so
# the Dockerfile cannot COPY src/ from the repo root. It installs the bridge
# from GitHub instead (see BRIDGE_REF in the Dockerfile).
build_from:
  aarch64: ghcr.io/home-assistant/aarch64-base-python:3.12-alpine3.19
  amd64: ghcr.io/home-assistant/amd64-base-python:3.12-alpine3.19
