---
# Build context is the repository root so the Dockerfile can COPY src/ and
# constraints.txt — the add-on is built from the same tree as the Docker image,
# not a separate vendored copy that could drift.
build_from:
  aarch64: ghcr.io/home-assistant/aarch64-base-python:3.12-alpine3.19
  amd64: ghcr.io/home-assistant/amd64-base-python:3.12-alpine3.19
