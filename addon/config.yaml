---
# Home Assistant add-on manifest.
#
# Ingress is the point of this file: the Supervisor proxies the UI at its own
# path and authenticates the user, so the bridge trusts it (api/auth.py treats
# an X-Ingress-Path request as a pre-authenticated admin) and no second login
# is needed. Port 8099 is still exposed optionally for direct/API access.
name: FranklinWH Modbus Bridge
version: "0.2.3"
slug: franklinwh_modbus_bridge
description: >-
  Poll a FranklinWH aGate over Modbus TCP and publish Home Assistant entities
  via MQTT Discovery, with scheduling, tariff tracking and multi-gateway support.
url: https://github.com/david2069/franklinwh-modbus-bridge
arch:
  - aarch64
  - amd64
init: false

# Ingress: UI served through the Supervisor, authenticated by HA.
ingress: true
ingress_port: 8099
panel_icon: mdi:home-battery
panel_title: FranklinWH
panel_admin: true

# Direct port is optional — the UI works through ingress without it. Publish it
# only if you want the REST API reachable from outside HA.
ports:
  8099/tcp: null
ports_description:
  8099/tcp: REST API and UI (optional — ingress works without this)

# Persist the SQLite database, backups and catalogs across add-on restarts.
map:
  - addon_config:rw

# hassio_api lets the add-on read the Supervisor's MQTT service so the broker
# is configured automatically rather than retyped. mqtt:want, not mqtt:need:
# the bridge is useful before a broker exists (UI, schedules, history), and it
# picks Mosquitto up by itself once installed — a hard requirement would only
# block install/start.
hassio_api: true
homeassistant_api: true
services:
  - mqtt:want

options:
  gateway_host: ""
  gateway_port: 502
  gateway_unit_id: 1
  poll_interval: 10
  log_level: INFO

schema:
  gateway_host: str?
  gateway_port: port
  gateway_unit_id: int(1,247)
  poll_interval: int(5,300)
  log_level: list(DEBUG|INFO|WARNING|ERROR|CRITICAL)
