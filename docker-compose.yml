services:
  app:
    build: .
    container_name: fwhbridge-app
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "8100:8099"
    volumes:
      - app-data:/data
      - /etc/localtime:/etc/localtime:ro
      # Dev: mount src for hot-reload (comment out for production)
      - ./src:/app/src
      # Dev: uncomment to live-mount the adjacent franklinwh-modbus library
      # - ../../../modbus/src/franklinwh_modbus:/usr/local/lib/python3.12/site-packages/franklinwh_modbus
    env_file:
      - path: .env
        required: false
    command: >-
      uvicorn franklinwh_bridge.main:app
      --host 0.0.0.0 --port 8099 --workers 1
      --reload --reload-dir /app/src
    environment:
      - APP_ENV=${APP_ENV:-docker}
      - DATA_DIR=/data
      - PYTHONPATH=/app/src
      # ── Timezone ──────────────────────────────────────────────
      # EVERY schedule trigger, TOU window and time.* sensor is evaluated in
      # the container's LOCAL time. The /etc/localtime bind mount above is not
      # dependable on Docker Desktop for macOS — it silently reverted to the
      # image's UTC on 2026-09-12 and a daily 18:00 export ran 10h out (04:00
      # local). TZ is authoritative and survives that, so set it explicitly.
      - TZ=${TZ:-Australia/Sydney}
      # ── Auth (multi-user) ─────────────────────────────────────
      # LAN/localhost dev over plain HTTP: allow login without TLS. Put this
      # Bridge behind TLS (Caddy/Tailscale) and drop ALLOW_INSECURE_AUTH +
      # set SESSION_COOKIE_SECURE=1 for real deployments.
      - ALLOW_INSECURE_AUTH=${ALLOW_INSECURE_AUTH:-1}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      # ── MQTT broker ───────────────────────────────────────────
      - MQTT_HOST=${MQTT_HOST:-mosquitto}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_USERNAME=${MQTT_USERNAME:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      # ── Modbus gateway ────────────────────────────────────────
      - MODBUS_HOST=${MODBUS_HOST:-192.168.1.100}
      - MODBUS_PORT=${MODBUS_PORT:-502}
      - MODBUS_UNIT_ID=${MODBUS_UNIT_ID:-1}
      # ── Logging ───────────────────────────────────────────────
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      mosquitto:
        condition: service_healthy
    networks:
      - fwh-bridge

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: fwhbridge-mosquitto
    restart: unless-stopped
    ports:
      - "1886:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - fwh-bridge

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: fwhbridge-homeassistant
    restart: unless-stopped
    ports:
      - "18125:8123"
    volumes:
      - ha-data:/config
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      mosquitto:
        condition: service_healthy
    networks:
      - fwh-bridge

volumes:
  app-data:
  mosquitto-data:
  mosquitto-log:
  ha-data:

networks:
  fwh-bridge:
    driver: bridge
