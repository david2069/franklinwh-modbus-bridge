name: Publish add-on image
# Builds the Home Assistant add-on image for each arch in addon/config.yaml and pushes it to
# GHCR as ghcr.io/david2069/{arch}-franklinwh-modbus-bridge:<addon/config.yaml version> (#300).
# Same steps and naming as franklinwh-direct-connect-bridge's publish-image.yml, adapted to
# this repo's layout: the add-on lives in addon/, which is the build context, as it is for
# the Supervisor.
#
# addon/Dockerfile pip-installs the bridge from GitHub at BRIDGE_REF (= v<version>), so the
# release tag must exist before the image can be built. Pushing a v* tag builds and pushes;
# workflow_dispatch builds a given ref (build-only by default) or re-runs a failed publish.
# A tag that exists is never overwritten, so the image tested on the HAOS VM is the image
# users get.
#
# addon/config.yaml has no `image:` yet, so the Supervisor still builds locally and nothing
# pulls these images. That line comes in a later release, once the first image is published
# and its GHCR package is public.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag, branch or commit to build (e.g. v0.2.41)"
        required: true
      push:
        description: "Push to GHCR (false = build only)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64
    env:
      # A tag push always publishes; a manual run publishes only when asked to.
      PUSH: ${{ github.event_name == 'push' || inputs.push }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Read version, image and base
        id: meta
        run: |
          version=$(sed -n 's/^version: "\(.*\)"/\1/p' addon/config.yaml)
          base=$(sed -n "s/^  ${{ matrix.arch }}: *\"\{0,1\}\([^\"]*\)\"\{0,1\}$/\1/p" addon/build.yaml)
          bridge_ref=$(sed -n 's/^ARG BRIDGE_REF=\(.*\)$/\1/p' addon/Dockerfile)
          image="ghcr.io/david2069/${{ matrix.arch }}-franklinwh-modbus-bridge"
          test -n "$version" && test -n "$base" || { echo "version or base missing"; exit 1; }
          grep -q "^  - ${{ matrix.arch }}$" addon/config.yaml || { echo "${{ matrix.arch }} not in addon/config.yaml arch"; exit 1; }
          # The image is named for the version but installs the code at BRIDGE_REF (#253).
          test "$bridge_ref" = "v$version" || { echo "BRIDGE_REF $bridge_ref != v$version"; exit 1; }
          if [ "${{ github.event_name }}" = "push" ]; then
            test "${{ github.ref_name }}" = "v$version" || { echo "tag ${{ github.ref_name }} != v$version"; exit 1; }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite a published version
        if: ${{ env.PUSH == 'true' }}
        run: |
          if docker manifest inspect "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}" >/dev/null 2>&1; then
            echo "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }} already exists; bump the version instead"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: addon
          file: addon/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ env.PUSH == 'true' }}
          build-args: |
            BUILD_FROM=${{ steps.meta.outputs.base }}
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          labels: |
            io.hass.name=FranklinWH Modbus Bridge
            io.hass.description=Poll a FranklinWH aGate over Modbus TCP and publish Home Assistant entities via MQTT Discovery
            io.hass.arch=${{ matrix.arch }}
            io.hass.type=addon
            io.hass.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=https://github.com/david2069/franklinwh-modbus-bridge
            org.opencontainers.image.licenses=MIT
