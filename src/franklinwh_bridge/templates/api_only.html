<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <base href="{{ base_path }}/">
  <title>API account · FranklinWH Bridge</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(1200px 600px at 50% -10%, #16233b 0%, #0b1220 60%, #090e18 100%);
      color: #e2e8f0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    .card {
      width: 100%; max-width: 400px; background: rgba(30, 41, 59, .6);
      border: 1px solid rgba(255, 255, 255, .08); border-radius: 16px; padding: 28px 26px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .45);
    }
    h1 { font-size: 15px; margin: 0 0 10px; font-weight: 700; color: #f1f5f9; }
    p { margin: 0 0 10px; color: #cbd5e1; }
    code { color: #67e8f9; }
    button {
      width: 100%; margin-top: 14px; padding: 11px; border: 0; border-radius: 9px; cursor: pointer;
      font-size: 14px; font-weight: 600; color: #06121b;
      background: linear-gradient(135deg, #22d3ee, #06b6d4);
    }
  </style>
</head>
<body>
  <div class="card" data-testid="api-only">
    <h1>This account is for the REST API only</h1>
    <p><code>{{ username }}</code> has the <code>api</code> role: it can read and
      command the bridge through <code>/api/…</code>, but the web pages are not
      available to it.</p>
    <p>Sign out, then sign in with a person's account to use the web UI.</p>
    <button type="button" id="out">Sign out</button>
  </div>
  <script>
    const base = document.querySelector('base').getAttribute('href').replace(/\/$/, '');
    document.getElementById('out').addEventListener('click', async () => {
      try { await fetch(`${base}/api/auth/logout`, { method: 'POST' }); } catch (_) {}
      window.location.href = `${base}/login`;
    });
  </script>
</body>
</html>
