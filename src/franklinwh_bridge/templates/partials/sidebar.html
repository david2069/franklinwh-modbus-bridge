<!-- ── Sidebar — Navigation ─────────────────────────────── -->
<aside class="w-56 flex flex-col bg-slate-800/50 border-r border-white/[0.08] flex-shrink-0 h-screen">

  <!-- Logo -->
  <div class="flex items-center gap-3 px-4 py-3 border-b border-white/[0.08]">
    <div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0"
         style="background: linear-gradient(135deg, var(--primary-light), var(--primary-dark));">
      <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
      </svg>
    </div>
    <div>
      <p class="text-sm font-bold text-slate-100 leading-tight">FranklinWH</p>
      <p class="text-[10px] text-slate-500 font-medium">Modbus Bridge</p>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">

    <button @click="$store.app.setTab('dashboard')"
            class="nav-item w-full"
            :class="$store.app.activeTab === 'dashboard' ? 'bg-cyan-500/10 text-cyan-300 border-l-2 border-cyan-400 pl-3' : ''">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
      <span>Dashboard</span>
    </button>

    <button @click="$store.app.setTab('explorer')"
            class="nav-item w-full"
            :class="$store.app.activeTab === 'explorer' ? 'bg-cyan-500/10 text-cyan-300 border-l-2 border-cyan-400 pl-3' : ''">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
      </svg>
      <span>SunSpec Explorer</span>
    </button>

    <button @click="$store.app.setTab('logs')"
            class="nav-item w-full"
            :class="$store.app.activeTab === 'logs' ? 'bg-cyan-500/10 text-cyan-300 border-l-2 border-cyan-400 pl-3' : ''">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
        <polyline points="10 9 9 9 8 9"/>
      </svg>
      <span>Logs</span>
    </button>

    <button @click="$store.app.setTab('sequencer')"
            class="nav-item w-full"
            :class="$store.app.activeTab === 'sequencer' ? 'bg-cyan-500/10 text-cyan-300 border-l-2 border-cyan-400 pl-3' : ''">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <polyline points="16 18 22 12 16 6"/>
        <polyline points="8 6 2 12 8 18"/>
      </svg>
      <span>Sequencer</span>
    </button>

    <button @click="$store.app.setTab('settings')"
            class="nav-item w-full"
            :class="$store.app.activeTab === 'settings' ? 'bg-cyan-500/10 text-cyan-300 border-l-2 border-cyan-400 pl-3' : ''">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      <span>Settings</span>
    </button>

  </nav>

  <!-- Footer -->
  <div class="border-t border-white/[0.08] px-4 py-3">
    <div class="text-[10px] text-slate-500 font-mono text-center"
         x-text="'v' + $store.app.version"></div>
  </div>
</aside>
