<!-- ── Sidebar — Collapsible Navigation ─────────────────── -->
<aside x-data="{ hoverText: '', hoverTop: 0, hoverTimer: null }"
       :class="$store.app.sidebarCollapsed ? 'w-14' : 'w-56'"
       class="flex flex-col bg-slate-800/50 border-r border-white/[0.08] flex-shrink-0 h-screen transition-all duration-300 relative">

  <!-- Logo -->
  <div class="flex items-center gap-3 px-3 py-3 border-b border-white/[0.08] overflow-hidden">
    <div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0 cursor-pointer"
         style="background: linear-gradient(135deg, var(--primary-light), var(--primary-dark));"
         @click="$store.app.sidebarCollapsed = !$store.app.sidebarCollapsed"
         :title="$store.app.sidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'">
      <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
      </svg>
    </div>
    <div x-show="!$store.app.sidebarCollapsed" x-transition.opacity.duration.200ms class="overflow-hidden whitespace-nowrap">
      <p class="text-sm font-bold text-slate-100 leading-tight">FranklinWH</p>
      <p class="text-[10px] text-slate-500 font-medium">Modbus Bridge</p>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 overflow-y-auto py-4 space-y-1" :class="$store.app.sidebarCollapsed ? 'px-1.5' : 'px-3'">

    <!-- Dashboard -->
    <button @click="$store.app.setTab('dashboard')"
            @mouseenter="if ($store.app.sidebarCollapsed) { clearTimeout(hoverTimer); hoverText = 'Dashboard'; hoverTop = Math.round($el.getBoundingClientRect().top + ($el.offsetHeight / 2) - 12); hoverTimer = setTimeout(() => hoverText = '', 1500) }"
            @mouseleave="clearTimeout(hoverTimer); hoverText = ''"
            class="nav-item w-full"
            :class="[
              $store.app.activeTab === 'dashboard' ? 'bg-cyan-500/10 text-cyan-300 border-l-2 border-cyan-400' : 'border-l-2 border-transparent',
              $store.app.sidebarCollapsed ? 'justify-center px-0 !border-l-0' : 'pl-3'
            ]">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
      <span x-show="!$store.app.sidebarCollapsed" x-transition.opacity.duration.200ms>Dashboard</span>
    </button>

    <!-- SunSpec Explorer -->
    <button @click="$store.app.setTab('explorer')"
            @mouseenter="if ($store.app.sidebarCollapsed) { clearTimeout(hoverTimer); hoverText = 'SunSpec Explorer'; hoverTop = Math.round($el.getBoundingClientRect().top + ($el.offsetHeight / 2) - 12); hoverTimer = setTimeout(() => hoverText = '', 1500) }"
            @mouseleave="clearTimeout(hoverTimer); hoverText = ''"
            class="nav-item w-full"
            :class="[
              $store.app.activeTab === 'explorer' ? 'bg-cyan-500/10 text-cyan-300 border-l-2 border-cyan-400' : 'border-l-2 border-transparent',
              $store.app.sidebarCollapsed ? 'justify-center px-0 !border-l-0' : 'pl-3'
            ]">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
      </svg>
      <span x-show="!$store.app.sidebarCollapsed" x-transition.opacity.duration.200ms>SunSpec Explorer</span>
    </button>

    <!-- Logs -->
    <button @click="$store.app.setTab('logs')"
            @mouseenter="if ($store.app.sidebarCollapsed) { clearTimeout(hoverTimer); hoverText = 'Logs'; hoverTop = Math.round($el.getBoundingClientRect().top + ($el.offsetHeight / 2) - 12); hoverTimer = setTimeout(() => hoverText = '', 1500) }"
            @mouseleave="clearTimeout(hoverTimer); hoverText = ''"
            class="nav-item w-full"
            :class="[
              $store.app.activeTab === 'logs' ? 'bg-cyan-500/10 text-cyan-300 border-l-2 border-cyan-400' : 'border-l-2 border-transparent',
              $store.app.sidebarCollapsed ? 'justify-center px-0 !border-l-0' : 'pl-3'
            ]">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
        <polyline points="10 9 9 9 8 9"/>
      </svg>
      <span x-show="!$store.app.sidebarCollapsed" x-transition.opacity.duration.200ms>Logs</span>
    </button>

    <!-- Sequencer -->
    <button @click="$store.app.setTab('sequencer')"
            @mouseenter="if ($store.app.sidebarCollapsed) { clearTimeout(hoverTimer); hoverText = 'Sequencer'; hoverTop = Math.round($el.getBoundingClientRect().top + ($el.offsetHeight / 2) - 12); hoverTimer = setTimeout(() => hoverText = '', 1500) }"
            @mouseleave="clearTimeout(hoverTimer); hoverText = ''"
            class="nav-item w-full"
            :class="[
              $store.app.activeTab === 'sequencer' ? 'bg-cyan-500/10 text-cyan-300 border-l-2 border-cyan-400' : 'border-l-2 border-transparent',
              $store.app.sidebarCollapsed ? 'justify-center px-0 !border-l-0' : 'pl-3'
            ]">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <polyline points="16 18 22 12 16 6"/>
        <polyline points="8 6 2 12 8 18"/>
      </svg>
      <span x-show="!$store.app.sidebarCollapsed" x-transition.opacity.duration.200ms>Sequencer</span>
    </button>

    <!-- Schedule -->
    <button @click="$store.app.setTab('schedule')"
            @mouseenter="if ($store.app.sidebarCollapsed) { clearTimeout(hoverTimer); hoverText = 'Schedule'; hoverTop = Math.round($el.getBoundingClientRect().top + ($el.offsetHeight / 2) - 12); hoverTimer = setTimeout(() => hoverText = '', 1500) }"
            @mouseleave="clearTimeout(hoverTimer); hoverText = ''"
            class="nav-item w-full"
            :class="[
              $store.app.activeTab === 'schedule' ? 'bg-cyan-500/10 text-cyan-300 border-l-2 border-cyan-400' : 'border-l-2 border-transparent',
              $store.app.sidebarCollapsed ? 'justify-center px-0 !border-l-0' : 'pl-3'
            ]">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        <circle cx="12" cy="16" r="3"/>
      </svg>
      <span x-show="!$store.app.sidebarCollapsed" x-transition.opacity.duration.200ms>Schedule</span>
    </button>

    <!-- HA Entities -->
    <button @click="$store.app.setTab('ha_entities')"
            @mouseenter="if ($store.app.sidebarCollapsed) { clearTimeout(hoverTimer); hoverText = 'HA Entities'; hoverTop = Math.round($el.getBoundingClientRect().top + ($el.offsetHeight / 2) - 12); hoverTimer = setTimeout(() => hoverText = '', 1500) }"
            @mouseleave="clearTimeout(hoverTimer); hoverText = ''"
            class="nav-item w-full"
            :class="[
              $store.app.activeTab === 'ha_entities' ? 'bg-cyan-500/10 text-cyan-300 border-l-2 border-cyan-400' : 'border-l-2 border-transparent',
              $store.app.sidebarCollapsed ? 'justify-center px-0 !border-l-0' : 'pl-3'
            ]">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M3 9.5L12 3l9 6.5"/><path d="M5 10v10h14V10"/><rect x="9" y="13" width="6" height="7"/>
      </svg>
      <span x-show="!$store.app.sidebarCollapsed" x-transition.opacity.duration.200ms>HA Entities</span>
    </button>

    <!-- Settings -->
    <button @click="$store.app.setTab('settings')"
            @mouseenter="if ($store.app.sidebarCollapsed) { clearTimeout(hoverTimer); hoverText = 'Settings'; hoverTop = Math.round($el.getBoundingClientRect().top + ($el.offsetHeight / 2) - 12); hoverTimer = setTimeout(() => hoverText = '', 1500) }"
            @mouseleave="clearTimeout(hoverTimer); hoverText = ''"
            class="nav-item w-full"
            :class="[
              $store.app.activeTab === 'settings' ? 'bg-cyan-500/10 text-cyan-300 border-l-2 border-cyan-400' : 'border-l-2 border-transparent',
              $store.app.sidebarCollapsed ? 'justify-center px-0 !border-l-0' : 'pl-3'
            ]">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      <span x-show="!$store.app.sidebarCollapsed" x-transition.opacity.duration.200ms>Settings</span>
    </button>

  </nav>

  <!-- Footer -->
  <div class="border-t border-white/[0.08] px-3 py-3">
    <div x-show="!$store.app.sidebarCollapsed" x-transition.opacity.duration.200ms
         class="text-[10px] text-slate-500 font-mono text-center"
         x-text="'v' + $store.app.version"></div>
    <button x-show="!$store.app.sidebarCollapsed"
            @click="$store.app.sidebarCollapsed = true"
            class="w-full flex items-center justify-center gap-2 mt-1 p-1 rounded hover:bg-slate-700/50 text-slate-600 hover:text-slate-400 transition text-[10px]">
      <span>◀ Collapse</span>
    </button>
    <button x-show="$store.app.sidebarCollapsed"
            @click="$store.app.sidebarCollapsed = false"
            class="w-full flex items-center justify-center p-1 rounded hover:bg-slate-700/50 text-slate-600 hover:text-slate-400 transition text-sm">
      ▶
    </button>
  </div>

  <!-- Hover tooltip (visible only when collapsed) -->
  <div x-show="$store.app.sidebarCollapsed && hoverText !== ''"
       x-transition:enter="transition ease-out duration-100"
       x-transition:enter-start="opacity-0 translate-x-1"
       x-transition:enter-end="opacity-100 translate-x-0"
       x-transition:leave="transition ease-in duration-75"
       x-transition:leave-start="opacity-100"
       x-transition:leave-end="opacity-0"
       class="sidebar-tooltip fixed left-[60px] z-[200] text-xs font-medium px-2.5 py-1.5 rounded-md shadow-xl pointer-events-none whitespace-nowrap"
       :style="`top: ${hoverTop}px`"
       x-text="hoverText">
  </div>
</aside>
