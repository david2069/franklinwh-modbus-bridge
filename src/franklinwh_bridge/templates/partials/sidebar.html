<!-- ── Sidebar — Collapsible Navigation ─────────────────── -->
<aside x-data="{ hoverText: '', hoverTop: 0 }"
       :class="$store.app.sidebarCollapsed ? 'w-14' : 'w-56'"
       class="flex flex-col bg-slate-800/50 border-r border-white/[0.08] flex-shrink-0 h-screen transition-all duration-300 relative">

  <!-- Logo -->
  <div class="flex items-center gap-3 px-3 py-3 border-b border-white/[0.08] overflow-hidden">
    <div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0 cursor-pointer text-white text-xs font-bold"
         style="background: linear-gradient(135deg, var(--primary-light), var(--primary-dark));"
         @click="$store.app.sidebarCollapsed = !$store.app.sidebarCollapsed"
         :title="$store.app.sidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'">
      FW
    </div>
    <div x-show="!$store.app.sidebarCollapsed" x-transition.opacity.duration.200ms class="overflow-hidden whitespace-nowrap">
      <p class="text-sm font-bold text-slate-100 leading-tight">FranklinWH</p>
      <p class="text-[10px] text-slate-500 font-medium">Modbus Bridge</p>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 overflow-y-auto py-4 space-y-1" :class="$store.app.sidebarCollapsed ? 'px-1.5' : 'px-3'">

    <!-- Dashboard -->
    <button @click="$store.app.setTab('dashboard')"
            @mouseenter="if ($store.app.sidebarCollapsed) { hoverText = 'Dashboard'; hoverTop = Math.round($el.getBoundingClientRect().top + ($el.offsetHeight / 2) - 12) }"
            @mouseleave="hoverText = ''"
            class="nav-item w-full"
            :class="[
              $store.app.activeTab === 'dashboard' ? 'bg-cyan-500/10 text-cyan-300 border-l-2 border-cyan-400' : 'border-l-2 border-transparent',
              $store.app.sidebarCollapsed ? 'justify-center px-0 !border-l-0' : 'pl-3'
            ]">
      <span class="w-5 text-center flex-shrink-0 text-xs font-bold" x-show="$store.app.sidebarCollapsed">DB</span>
      <span x-show="!$store.app.sidebarCollapsed" x-transition.opacity.duration.200ms>Dashboard</span>
    </button>

    <!-- SunSpec Explorer -->
    <button @click="$store.app.setTab('explorer')"
            @mouseenter="if ($store.app.sidebarCollapsed) { hoverText = 'SunSpec Explorer'; hoverTop = Math.round($el.getBoundingClientRect().top + ($el.offsetHeight / 2) - 12) }"
            @mouseleave="hoverText = ''"
            class="nav-item w-full"
            :class="[
              $store.app.activeTab === 'explorer' ? 'bg-cyan-500/10 text-cyan-300 border-l-2 border-cyan-400' : 'border-l-2 border-transparent',
              $store.app.sidebarCollapsed ? 'justify-center px-0 !border-l-0' : 'pl-3'
            ]">
      <span class="w-5 text-center flex-shrink-0 text-xs font-bold" x-show="$store.app.sidebarCollapsed">EX</span>
      <span x-show="!$store.app.sidebarCollapsed" x-transition.opacity.duration.200ms>SunSpec Explorer</span>
    </button>

    <!-- Logs -->
    <button @click="$store.app.setTab('logs')"
            @mouseenter="if ($store.app.sidebarCollapsed) { hoverText = 'Logs'; hoverTop = Math.round($el.getBoundingClientRect().top + ($el.offsetHeight / 2) - 12) }"
            @mouseleave="hoverText = ''"
            class="nav-item w-full"
            :class="[
              $store.app.activeTab === 'logs' ? 'bg-cyan-500/10 text-cyan-300 border-l-2 border-cyan-400' : 'border-l-2 border-transparent',
              $store.app.sidebarCollapsed ? 'justify-center px-0 !border-l-0' : 'pl-3'
            ]">
      <span class="w-5 text-center flex-shrink-0 text-xs font-bold" x-show="$store.app.sidebarCollapsed">LG</span>
      <span x-show="!$store.app.sidebarCollapsed" x-transition.opacity.duration.200ms>Logs</span>
    </button>

    <!-- Sequencer -->
    <button @click="$store.app.setTab('sequencer')"
            @mouseenter="if ($store.app.sidebarCollapsed) { hoverText = 'Sequencer'; hoverTop = Math.round($el.getBoundingClientRect().top + ($el.offsetHeight / 2) - 12) }"
            @mouseleave="hoverText = ''"
            class="nav-item w-full"
            :class="[
              $store.app.activeTab === 'sequencer' ? 'bg-cyan-500/10 text-cyan-300 border-l-2 border-cyan-400' : 'border-l-2 border-transparent',
              $store.app.sidebarCollapsed ? 'justify-center px-0 !border-l-0' : 'pl-3'
            ]">
      <span class="w-5 text-center flex-shrink-0 text-xs font-bold" x-show="$store.app.sidebarCollapsed">SQ</span>
      <span x-show="!$store.app.sidebarCollapsed" x-transition.opacity.duration.200ms>Sequencer</span>
    </button>

    <!-- Settings -->
    <button @click="$store.app.setTab('settings')"
            @mouseenter="if ($store.app.sidebarCollapsed) { hoverText = 'Settings'; hoverTop = Math.round($el.getBoundingClientRect().top + ($el.offsetHeight / 2) - 12) }"
            @mouseleave="hoverText = ''"
            class="nav-item w-full"
            :class="[
              $store.app.activeTab === 'settings' ? 'bg-cyan-500/10 text-cyan-300 border-l-2 border-cyan-400' : 'border-l-2 border-transparent',
              $store.app.sidebarCollapsed ? 'justify-center px-0 !border-l-0' : 'pl-3'
            ]">
      <span class="w-5 text-center flex-shrink-0 text-xs font-bold" x-show="$store.app.sidebarCollapsed">ST</span>
      <span x-show="!$store.app.sidebarCollapsed" x-transition.opacity.duration.200ms>Settings</span>
    </button>

  </nav>

  <!-- Footer -->
  <div class="border-t border-white/[0.08] px-3 py-3">
    <div x-show="!$store.app.sidebarCollapsed" x-transition.opacity.duration.200ms
         class="text-[10px] text-slate-500 font-mono text-center"
         x-text="'v' + $store.app.version"></div>
    <button x-show="!$store.app.sidebarCollapsed"
            @click="$store.app.sidebarCollapsed = true"
            class="w-full flex items-center justify-center gap-2 mt-1 p-1 rounded hover:bg-slate-700/50 text-slate-600 hover:text-slate-400 transition text-[10px]">
      <span>◀ Collapse</span>
    </button>
    <button x-show="$store.app.sidebarCollapsed"
            @click="$store.app.sidebarCollapsed = false"
            class="w-full flex items-center justify-center p-1 rounded hover:bg-slate-700/50 text-slate-600 hover:text-slate-400 transition text-sm">
      ▶
    </button>
  </div>

  <!-- Hover tooltip (visible only when collapsed) -->
  <div x-show="$store.app.sidebarCollapsed && hoverText !== ''"
       x-transition:enter="transition ease-out duration-150"
       x-transition:enter-start="opacity-0 translate-x-1"
       x-transition:enter-end="opacity-100 translate-x-0"
       x-transition:leave="transition ease-in duration-100"
       x-transition:leave-start="opacity-100"
       x-transition:leave-end="opacity-0"
       class="fixed left-[60px] z-[200] text-xs font-medium px-2.5 py-1.5 rounded-md shadow-xl bg-slate-700 text-slate-200 border border-white/[0.08] pointer-events-none whitespace-nowrap"
       :style="`top: ${hoverTop}px`"
       x-text="hoverText">
  </div>
</aside>
