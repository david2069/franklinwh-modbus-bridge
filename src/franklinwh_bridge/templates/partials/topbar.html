<!-- ── Topbar ─────────────────────────────────────────── -->
<!-- One rule at every width: nothing is hidden because the window is narrow;
     the bar wraps onto a second line when it doesn't fit (#262, owner
     2026-10-18: per-item breakpoints left 700-767 px with no status dots). -->
<header class="flex flex-wrap gap-y-1 items-center justify-between gap-x-2 lg:gap-4 px-3 lg:px-6 py-2 lg:py-3 border-b border-white/[0.08] bg-slate-800/30 backdrop-blur-sm sticky top-0 z-50">

  <!-- Left: Sidebar toggle + Page title -->
  <div class="flex items-center gap-2 lg:gap-3 min-w-0">
    <button @click="$store.app.toggleSidebar()" x-show="!$store.app.phoneNav && $store.app.tbShow('left', 'sidebar')"
            class="p-1.5 rounded hover:bg-slate-700 transition text-slate-400 hover:text-slate-200 text-sm font-bold"
            :title="$store.app.sidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'"
            x-text="$store.app.sidebarCollapsed ? '▶' : '◀'">
    </button>

    <h1 x-show="$store.app.tbShow('left', 'title')"
        class="text-sm font-semibold text-slate-300 uppercase tracking-wider whitespace-nowrap"
        x-text="({ dashboard: 'Dashboard', explorer: 'SunSpec Explorer', logs: 'Logs',
                   sequencer: 'Sequencer', schedule: 'Schedule', ha_entities: 'Home Assistant',
                   energy_costs: 'Energy Costs', settings: 'Settings' })[$store.app.activeTab] || ''">
    </h1>
  </div>

  <!-- Gateway selector (dropdown, visible when multiple gateways) -->
  <div x-show="$store.app.multiGateway && $store.app.tbShow('left', 'gateway')" x-cloak x-data="{ open: false }"
       @click.away="open = false" @keydown.escape="open = false"
       class="relative">
    <button @click="open = !open"
            class="flex items-center gap-1.5 px-2.5 py-1 text-xs font-medium rounded border border-slate-600/40 bg-slate-700/40 text-slate-200 hover:bg-slate-700 transition">
      <span class="w-1.5 h-1.5 rounded-full"
            :class="gwDotClass($store.app.activeGatewayHealth)"></span>
      <span x-text="$store.app.activeGatewayName"></span>
      <svg class="w-3 h-3 text-slate-400 transition-transform" :class="open && 'rotate-180'"
           fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
      </svg>
    </button>
    <div x-show="open" x-transition x-cloak
         class="absolute left-0 mt-1 w-56 rounded-lg border border-slate-600/40 bg-slate-800 shadow-xl z-50 py-1 text-xs">
      <!-- All gateways: a read-only overview (#296 item 43); it replaced the
           "Site (All Gateways)" view, whose commands went to the default. -->
      <button @click="$store.app.allGatewaysOpen = true; open = false" data-testid="all-gateways-open"
              class="w-full flex items-center gap-2 px-3 py-1.5 hover:bg-slate-700/60 transition text-slate-300">
        <span class="w-1.5 h-1.5 rounded-full bg-slate-500"></span>
        <span class="flex-1 text-left">All gateways…</span>
      </button>
      <div class="my-1 border-t border-slate-700/60"></div>
      <div class="px-3 py-0.5 text-[9px] uppercase tracking-wider text-slate-500">Gateways</div>
      <template x-for="gw in $store.app.gatewayList" :key="gw.id">
        <button @click="$store.app.setGateway(gw.id); open = false"
                class="w-full flex items-center gap-2 px-3 py-1.5 hover:bg-slate-700/60 transition"
                :class="$store.app.activeGateway === gw.id ? 'text-cyan-400' : 'text-slate-300'">
          <span class="w-1.5 h-1.5 rounded-full" :class="gwDotClass(gw.health)"></span>
          <span class="flex-1 text-left" x-text="gwLabel(gw)"></span>
          <span class="text-[10px] text-slate-500" x-text="gwStatusText(gw)"></span>
        </button>
      </template>
    </div>
  </div>

  <!-- Centre: System status indicators (order + visibility driven by topbarPrefs).
       Shown at every width (#82, #262). Each is an icon and its live value
       (owner, 2026-10-28). The icon's colour is its state, grey when inactive;
       red is kept for critical. Grid not connected is amber. The hover text
       says what each one is. Icons drawn for this project. -->
  <div class="items-center gap-3 text-xs font-semibold tabular-nums"
       :class="$store.app.phoneNav ? 'flex order-last' : 'flex'">
    <!-- Grid -->
    <div x-show="$store.app.tbShow('center', 'grid')" :style="$store.app.tbOrder('center', 'grid')"
         data-testid="topbar-grid" class="flex items-center gap-1"
         :title="'Grid power: ' + fmt.kw($store.app.gridPowerW) + ' kW, '
                + ($store.app.gridPowerW > 0 ? 'importing' : ($store.app.gridPowerW < 0 ? 'exporting' : 'neutral'))
                + '. Grid ' + ($store.app.points.connection_state === 'Connected' ? 'connected' : 'not connected') + '.'">
      <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"
           :class="$store.app.points.connection_state === 'Connected' ? 'text-emerald-400' : 'text-amber-400'">
        <path d="M12 2 7 22M12 2l5 20M4 6h16M6.5 10h11M4 6v2M20 6v2M6.5 10v2M17.5 10v2M10 10l5.4 5.5M14 10l-5.4 5.5M8.6 15.5h6.8M7 22h10"/>
      </svg>
      <span class="text-slate-300" x-text="fmt.kw($store.app.gridPowerW) + ' kW'"></span>
    </div>
    <!-- Solar -->
    <div x-show="$store.app.tbShow('center', 'solar')" :style="$store.app.tbOrder('center', 'solar')"
         data-testid="topbar-solar" class="flex items-center gap-1"
         :title="'Solar power: ' + fmt.kw($store.app.solarPowerW) + ' kW, ' + (($store.app.solarPowerW ?? 0) > 0 ? 'generating' : 'not generating') + '.'">
      <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"
           :class="($store.app.solarPowerW ?? 0) > 0 ? 'text-emerald-400' : 'text-slate-500'">
        <path d="M6 3h12l3 11H3z"/><path d="M10 3 9 14M14 3l1 11M4.5 8.5h15M12 14v7M8 21h8"/>
      </svg>
      <span class="text-slate-300" x-text="fmt.kw($store.app.solarPowerW) + ' kW'"></span>
    </div>
    <!-- Load -->
    <div x-show="$store.app.tbShow('center', 'load')" :style="$store.app.tbOrder('center', 'load')"
         data-testid="topbar-load" class="flex items-center gap-1"
         :title="'Home load: ' + fmt.kw($store.app.homePowerW) + ' kW, ' + (($store.app.homePowerW ?? 0) > 0 ? 'consuming' : 'none') + '.'">
      <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"
           :class="($store.app.homePowerW ?? 0) > 0 ? 'text-emerald-400' : 'text-slate-500'">
        <path d="M3 11 12 3l9 8"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/>
      </svg>
      <span class="text-slate-300" x-text="fmt.kw($store.app.homePowerW) + ' kW'"></span>
    </div>
    <!-- Battery: state of charge. Red at or below 5% (critical), amber at or
         below the active reserve; otherwise the state's colour. -->
    <div x-show="$store.app.tbShow('center', 'battery')" :style="$store.app.tbOrder('center', 'battery')"
         data-testid="topbar-battery" class="flex items-center gap-1"
         :title="'Battery state of charge: ' + fmt.pct($store.app.batterySoc) + ', ' + ($store.app.points.battery_state || 'Standby').toLowerCase() + '.'
                + ($store.app.batteryLevel === 'critical' ? ' Critical: at or below 5%.'
                   : $store.app.batteryLevel === 'low' ? ' At or below the active reserve (' + fmt.pct($store.app.points.active_reserve_pct) + ').' : '')">
      <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"
           :class="$store.app.batteryLevel === 'critical' ? 'text-red-400' :
                   $store.app.batteryLevel === 'low' ? 'text-amber-400' :
                   $store.app.points.battery_state === 'Charging' ? 'text-emerald-400' :
                   $store.app.points.battery_state === 'Discharging' ? 'text-orange-400' : 'text-slate-500'">
        <rect x="7" y="4" width="10" height="17" rx="2"/><path d="M10 2h4M10 13h4M10 16.5h4"/>
      </svg>
      <span :class="$store.app.batteryLevel === 'critical' ? 'text-red-400' :
                    $store.app.batteryLevel === 'low' ? 'text-amber-400' :
                    $store.app.points.battery_state === 'Charging' ? 'text-emerald-400' :
                    $store.app.points.battery_state === 'Discharging' ? 'text-orange-400' : 'text-slate-300'"
            x-text="fmt.pct($store.app.batterySoc)"></span>
      <span x-show="$store.app.forcedDispatch" x-cloak
            class="px-1.5 py-0.5 rounded text-[10px] font-bold uppercase tracking-wide
                   bg-amber-500/20 text-amber-400 border border-amber-500/40 animate-pulse"
            :title="$store.app.forcedDispatch + ' — user-commanded dispatch active'">Forced</span>
    </div>
  </div>

  <!-- Right: Status indicators + actions -->
  <div class="flex flex-wrap items-center gap-x-3 gap-y-1 min-w-0">

    <!-- Logged out: the bridge answers but refuses this page's login. -->
    <button type="button" x-show="$store.app.loggedOut" @click="$store.app.goToLogin()" style="order:-1"
            class="flex items-center gap-2 text-xs font-medium text-amber-400 hover:text-amber-300">
      <span>Logged out — log in</span>
      <div class="w-2 h-2 rounded-full bg-amber-400"></div>
    </button>

    <!-- Connection status (text-then-dot, matching the indicators on the left) -->
    <div class="flex items-center gap-2" x-show="!$store.app.loggedOut && $store.app.tbShow('right', 'status')"
         :style="$store.app.tbOrder('right', 'status')">
      <span class="text-xs font-medium"
            :class="$store.app.connected ? 'text-emerald-400' : 'text-red-400'"
            x-text="$store.app.connected ? 'Connected' : 'Disconnected'"></span>
      <div class="w-2 h-2 rounded-full"
           :class="$store.app.connected ? 'bg-emerald-400' : 'bg-red-400'"></div>
    </div>

    <!-- Quality badge — only shown when data is stale/bad (hidden when ok) -->
    <div class="chip"
         :class="$store.app.quality === 'stale' ? 'warn' : 'error'"
         x-show="$store.app.quality && $store.app.quality !== 'ok' && $store.app.tbShow('right', 'quality')"
         :style="$store.app.tbOrder('right', 'quality')"
         x-text="$store.app.quality"></div>

    <!-- Last poll, in the BRIDGE's zone and labelled with it (#79). One time
         only (owner, 2026-10-28). Full stamp on hover. -->
    <span data-testid="topbar-clock" class="text-xs text-slate-500"
          x-show="$store.app.tbShow('right', 'clock')" :style="$store.app.tbOrder('right', 'clock')"
          :title="$store.app.hasAnyGateway ? 'Last poll: ' + fmt.at($store.app.lastPollTs) : 'No aGate or demo gateway set up yet'"
          x-text="$store.app.hasAnyGateway
            ? (fmt.clock($store.app.lastPollTs) + ($store.app.lastPollTs ? ' ' + fmt.tz() : ''))
            : 'No gateway yet'"></span>

    <!-- Release control button: amber while a command is active (red is
         kept for critical; owner, 2026-10-28) -->
    <button x-show="$store.app.tbShow('right', 'release')" :style="$store.app.tbOrder('right', 'release')"
            @click="$store.app.releaseResult = null; $store.app.showReleaseModal = true"
            class="relative flex items-center gap-1.5 px-2.5 py-1 rounded text-xs font-semibold transition-all duration-200"
            :class="$store.app.isReleaseable
              ? 'bg-amber-500/20 text-amber-400 border border-amber-500/40 hover:bg-amber-500/30'
              : 'bg-slate-700/50 text-slate-500 border border-slate-600/30 hover:bg-slate-700 hover:text-slate-400'"
            :title="$store.app.isReleaseable ? 'Active control — click to review' : 'No active control'">
      <span x-show="$store.app.isReleaseable"
            class="absolute -top-0.5 -right-0.5 w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
      <span>Release</span>
    </button>

    <!-- Model point source toggle -->
    <button x-show="$store.app.tbShow('right', 'sunspec')" :style="$store.app.tbOrder('right', 'sunspec')"
            @click="$store.app.toggleSources()"
            class="flex items-center gap-1 px-2 py-1 rounded text-xs font-medium transition"
            :class="$store.app.showSources
              ? 'bg-cyan-500/20 text-cyan-400 border border-cyan-500/30'
              : 'text-slate-300 hover:text-slate-100 bg-slate-700/50 hover:bg-slate-700 border border-slate-600/30'"
            title="Toggle SunSpec model.point annotations">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 6.75L22.5 12l-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3l-4.5 16.5"/>
      </svg>
      <span x-text="$store.app.showSources ? 'SunSpec' : 'SunSpec'">SunSpec</span>
    </button>

    <!-- User menu -->
    <div class="relative" x-data="{ open: false }" @click.away="open = false"
         x-show="$store.app.me && $store.app.tbShow('right', 'user')" :style="$store.app.tbOrder('right', 'user')">
      <button @click="open = !open"
              class="flex items-center gap-1.5 px-1.5 py-1 rounded hover:bg-slate-700 transition text-slate-300"
              :title="'Signed in as ' + ($store.app.me?.username || '')">
        <span class="w-6 h-6 rounded-full bg-cyan-500/20 text-cyan-300 grid place-items-center text-[11px] font-semibold uppercase"
              x-text="($store.app.me?.username || '?').slice(0,1)"></span>
        <span class="text-xs" x-text="$store.app.me?.username"></span>
      </button>
      <div x-show="open" x-cloak x-transition
           class="absolute right-0 mt-1 w-44 rounded-md border border-white/10 bg-slate-800 shadow-2xl py-1 z-[80]">
        <div class="px-3 py-2 text-xs text-slate-400 border-b border-white/10">
          Signed in as <span class="text-slate-200" x-text="$store.app.me?.username"></span>
          <span class="ml-1 text-[10px] uppercase tracking-wide text-cyan-400" x-text="$store.app.me?.role"></span>
        </div>
        <button @click="$store.app.logout()" class="w-full text-left px-3 py-2 text-xs text-slate-300 hover:bg-white/[0.05]">Sign out</button>
      </div>
    </div>

    <!-- Theme toggle -->
    <button x-show="$store.app.tbShow('right', 'theme')" :style="$store.app.tbOrder('right', 'theme')"
            @click="$store.app.toggleTheme()"
            class="block p-1.5 rounded hover:bg-slate-700 transition text-slate-400 hover:text-slate-200"
            :title="$store.app.theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'">
      <svg x-show="$store.app.theme === 'dark'" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="5"/><path stroke-linecap="round" d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
      </svg>
      <svg x-show="$store.app.theme === 'light'" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>

    <!-- Refresh button -->
    <button x-show="$store.app.tbShow('right', 'refresh')" :style="$store.app.tbOrder('right', 'refresh')"
            @click="$store.app.refresh()"
            class="block p-1.5 rounded hover:bg-slate-700 transition text-slate-400 hover:text-slate-200"
            title="Refresh now">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h5M20 20v-5h-5"/>
        <path stroke-linecap="round" d="M20.49 9A9 9 0 0 0 5.64 5.64L4 7m16 10l-1.64 1.36A9 9 0 0 1 3.51 15"/>
      </svg>
    </button>

    <!-- Topbar preferences gear -->
    <!-- Phones: the panel is fixed just below the gear and spans the screen with a
         16px gutter; anchored to the gear it ran off the left edge. -->
    <div class="relative shrink-0" style="order:999" x-data="{ open: false, top: 0 }" @click.away="open = false">
      <button @click="top = $el.getBoundingClientRect().bottom; open = !open; $store.app.showTopbarPrefs = open"
              class="p-1.5 rounded hover:bg-slate-700 transition"
              :class="open ? 'text-cyan-400 bg-slate-700' : 'text-slate-400 hover:text-slate-200'"
              title="Topbar preferences">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
      </button>

      <!-- Preferences dropdown -->
      <div x-show="open" x-transition x-cloak
           :style="Object.assign({ maxHeight: `calc(100dvh - ${top}px - 24px)`, overflowY: 'auto' },
                  window.innerWidth < 640 ? { position: 'fixed', left: '16px', right: '16px', width: 'auto', top: `${top}px` } : {})"
           class="absolute right-0 top-full mt-2 w-72 bg-slate-800 border border-white/[0.1] rounded-xl shadow-2xl z-[200] overflow-hidden">
        <div class="px-4 py-2.5 border-b border-white/[0.06] flex items-center justify-between">
          <span class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Topbar Preferences</span>
          <button @click="$store.app.resetTopbarPrefs(); open = false"
                  class="text-[10px] text-slate-500 hover:text-amber-400 transition">Reset</button>
        </div>

        <!-- Left items: show/hide only -->
        <div class="px-4 py-2 border-b border-white/[0.06]">
          <div class="text-[9px] uppercase tracking-wider text-slate-500 font-semibold mb-2">Left</div>
          <template x-for="item in $store.app.topbarPrefs.left" :key="item.key">
            <div class="flex items-center gap-2 py-1">
              <label class="flex items-center gap-1.5 flex-1 cursor-pointer">
                <input type="checkbox" :checked="item.visible"
                       @change="item.visible = $event.target.checked; $store.app.saveTopbarPrefs()"
                       class="rounded border-slate-600 bg-slate-700 w-3 h-3 accent-cyan-500">
                <span class="text-[11px]" :class="item.visible ? 'text-slate-300' : 'text-slate-600'" x-text="item.label"></span>
              </label>
            </div>
          </template>
        </div>

        <!-- Centre indicators -->
        <div class="px-4 py-2 border-b border-white/[0.06]">
          <div class="text-[9px] uppercase tracking-wider text-slate-500 font-semibold mb-2">Centre Indicators</div>
          <template x-for="(item, idx) in $store.app.topbarPrefs.center" :key="item.key">
            <div class="flex items-center gap-2 py-1">
              <label class="flex items-center gap-1.5 flex-1 cursor-pointer">
                <input type="checkbox" :checked="item.visible"
                       @change="item.visible = $event.target.checked; $store.app.saveTopbarPrefs()"
                       class="rounded border-slate-600 bg-slate-700 w-3 h-3 accent-cyan-500">
                <span class="text-[11px]" :class="item.visible ? 'text-slate-300' : 'text-slate-600'" x-text="item.label"></span>
              </label>
              <div class="flex gap-1">
                <button @click="$store.app.moveTopbarItem('center', idx, -1)"
                        :disabled="idx === 0"
                        class="text-[10px] px-1 rounded text-slate-500 hover:text-slate-200 disabled:opacity-20 transition">↑</button>
                <button @click="$store.app.moveTopbarItem('center', idx, 1)"
                        :disabled="idx === $store.app.topbarPrefs.center.length - 1"
                        class="text-[10px] px-1 rounded text-slate-500 hover:text-slate-200 disabled:opacity-20 transition">↓</button>
              </div>
            </div>
          </template>
        </div>

        <!-- Right-side buttons -->
        <div class="px-4 py-2">
          <div class="text-[9px] uppercase tracking-wider text-slate-500 font-semibold mb-2">Right</div>
          <template x-for="(item, idx) in $store.app.topbarPrefs.right" :key="item.key">
            <div class="flex items-center gap-2 py-1">
              <label class="flex items-center gap-1.5 flex-1 cursor-pointer">
                <input type="checkbox" :checked="item.visible"
                       @change="item.visible = $event.target.checked; $store.app.saveTopbarPrefs()"
                       class="rounded border-slate-600 bg-slate-700 w-3 h-3 accent-cyan-500">
                <span class="text-[11px]" :class="item.visible ? 'text-slate-300' : 'text-slate-600'" x-text="item.label"></span>
              </label>
              <div class="flex gap-1">
                <button @click="$store.app.moveTopbarItem('right', idx, -1)"
                        :disabled="idx === 0"
                        class="text-[10px] px-1 rounded text-slate-500 hover:text-slate-200 disabled:opacity-20 transition">↑</button>
                <button @click="$store.app.moveTopbarItem('right', idx, 1)"
                        :disabled="idx === $store.app.topbarPrefs.right.length - 1"
                        class="text-[10px] px-1 rounded text-slate-500 hover:text-slate-200 disabled:opacity-20 transition">↓</button>
              </div>
            </div>
          </template>
        </div>
      </div>
    </div>
  </div>

</header>
