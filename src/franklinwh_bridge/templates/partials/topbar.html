<!-- ── Topbar ─────────────────────────────────────────── -->
<header class="flex items-center justify-between gap-4 px-4 lg:px-6 py-3 border-b border-white/[0.08] bg-slate-800/30 backdrop-blur-sm sticky top-0 z-50">

  <!-- Left: Sidebar toggle + Page title -->
  <div class="flex items-center gap-3">
    <button @click="$store.app.sidebarCollapsed = !$store.app.sidebarCollapsed"
            class="p-1.5 rounded hover:bg-slate-700 transition text-slate-400 hover:text-slate-200 text-sm font-bold"
            :title="$store.app.sidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'"
            x-text="$store.app.sidebarCollapsed ? '▶' : '◀'">
    </button>

    <h1 class="text-sm font-semibold text-slate-300 uppercase tracking-wider"
        x-text="$store.app.activeTab === 'dashboard' ? 'Dashboard' :
                $store.app.activeTab === 'explorer' ? 'SunSpec Explorer' :
                $store.app.activeTab === 'logs' ? 'Logs' :
                $store.app.activeTab === 'sequencer' ? 'Sequencer' :
                'Settings'">
    </h1>
  </div>

  <!-- Centre: System status indicators -->
  <div class="flex items-center gap-3 text-[10px] font-semibold uppercase tracking-wider">
    <!-- Grid -->
    <div class="flex items-center gap-1.5">
      <span class="text-slate-500">Grid</span>
      <span class="w-1.5 h-1.5 rounded-full"
            :class="$store.app.points.connection_state === 'Connected' ? 'bg-emerald-400' : 'bg-red-400'"></span>
    </div>
    <!-- Solar -->
    <div class="flex items-center gap-1.5">
      <span class="text-slate-500">Solar</span>
      <span class="w-1.5 h-1.5 rounded-full"
            :class="($store.app.solarPowerW ?? 0) > 0 ? 'bg-emerald-400' : 'bg-red-400'"></span>
    </div>
    <!-- Home -->
    <div class="flex items-center gap-1.5">
      <span class="text-slate-500">Load</span>
      <span class="w-1.5 h-1.5 rounded-full"
            :class="($store.app.homePowerW ?? 0) > 0 ? 'bg-emerald-400' : 'bg-slate-600'"></span>
    </div>
  </div>

  <!-- Right: Status indicators + actions -->
  <div class="flex items-center gap-4">

    <!-- Connection status -->
    <div class="flex items-center gap-2">
      <div class="w-2 h-2 rounded-full"
           :class="$store.app.connected ? 'bg-emerald-400' : 'bg-red-400'"></div>
      <span class="text-xs font-medium"
            :class="$store.app.connected ? 'text-emerald-400' : 'text-red-400'"
            x-text="$store.app.connected ? 'Connected' : 'Disconnected'"></span>
    </div>

    <!-- Quality badge -->
    <div class="chip"
         :class="$store.app.quality === 'ok' ? 'ok' : ($store.app.quality === 'stale' ? 'warn' : 'error')"
         x-show="$store.app.quality"
         x-text="$store.app.quality"></div>

    <!-- Last poll -->
    <span class="text-xs text-slate-500" x-text="fmt.ago($store.app.lastPollTs)"></span>

    <!-- Release control button -->
    <button @click="$store.app.showReleaseModal = true"
            class="relative flex items-center gap-1.5 px-2.5 py-1 rounded text-xs font-semibold transition-all duration-200"
            :class="$store.app.isReleaseable
              ? 'bg-red-500/20 text-red-400 border border-red-500/40 hover:bg-red-500/30 hover:border-red-400'
              : 'bg-slate-700/50 text-slate-500 border border-slate-600/30 hover:bg-slate-700 hover:text-slate-400'"
            :title="$store.app.isReleaseable ? 'Active control — click to review' : 'No active control'">
      <span x-show="$store.app.isReleaseable"
            class="absolute -top-0.5 -right-0.5 w-2 h-2 rounded-full bg-red-400 animate-pulse"></span>
      <span>Release</span>
    </button>

    <!-- Model point source toggle -->
    <button @click="$store.app.toggleSources()"
            class="p-1.5 rounded transition"
            :class="$store.app.showSources ? 'bg-cyan-500/15 text-cyan-400' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-700'"
            title="Toggle SunSpec model.point annotations">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 6.75L22.5 12l-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3l-4.5 16.5"/>
      </svg>
    </button>

    <!-- Theme toggle -->
    <button @click="$store.app.toggleTheme()"
            class="p-1.5 rounded hover:bg-slate-700 transition text-slate-400 hover:text-slate-200"
            :title="$store.app.theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'">
      <!-- Sun icon (shown in dark mode → click for light) -->
      <svg x-show="$store.app.theme === 'dark'" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="5"/><path stroke-linecap="round" d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
      </svg>
      <!-- Moon icon (shown in light mode → click for dark) -->
      <svg x-show="$store.app.theme === 'light'" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>

    <!-- Refresh button -->
    <button @click="$store.app.refresh()"
            class="p-1.5 rounded hover:bg-slate-700 transition text-slate-400 hover:text-slate-200"
            title="Refresh now">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h5M20 20v-5h-5"/>
        <path stroke-linecap="round" d="M20.49 9A9 9 0 0 0 5.64 5.64L4 7m16 10l-1.64 1.36A9 9 0 0 1 3.51 15"/>
      </svg>
    </button>
  </div>

</header>
