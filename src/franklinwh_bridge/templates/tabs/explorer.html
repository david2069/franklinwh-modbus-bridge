<!-- ── SunSpec Explorer Tab — two-panel layout ──────────── -->
<div x-data="explorerTab()">

  <!-- Connection bar -->
  <div class="card !p-3 mb-4">
    <div class="flex items-center gap-4 flex-wrap">
      <div class="flex items-center gap-2 text-xs">
        <span class="text-slate-500 font-semibold uppercase tracking-wider">Gateway</span>
        <span class="font-mono text-slate-300" x-text="gateway.host + ':' + gateway.port"></span>
        <span class="text-slate-600">unit</span>
        <span class="font-mono text-slate-300" x-text="gateway.unit_id"></span>
      </div>
      <div class="flex items-center gap-2 ml-auto">
        <span class="text-xs text-slate-500" x-show="modelCount > 0"
              x-text="modelCount + ' models, ' + pointCount + ' points'"></span>
        <button @click="refreshCatalog()"
                class="px-3 py-1.5 text-xs font-medium rounded bg-cyan-500/15 text-cyan-400 hover:bg-cyan-500/25 transition disabled:opacity-40"
                :disabled="refreshing">
          <span x-show="!refreshing">Refresh Catalog</span>
          <span x-show="refreshing" class="flex items-center gap-1.5">
            <span class="loading-spinner !w-3 !h-3"></span> Scanning...
          </span>
        </button>
      </div>
    </div>
  </div>

  <!-- Loading state -->
  <div x-show="loading" class="flex items-center gap-3 py-16 justify-center">
    <div class="loading-spinner"></div>
    <span class="text-sm text-slate-500">Loading SunSpec catalog...</span>
  </div>

  <!-- Empty state -->
  <div x-show="!loading && models.length === 0" class="text-center py-16 text-slate-500">
    <svg class="w-12 h-12 mx-auto mb-3 text-slate-700" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
      <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
      <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
    </svg>
    <p class="text-lg mb-2">No SunSpec catalog</p>
    <p class="text-sm mb-4">Click "Refresh Catalog" to scan the connected device</p>
    <button @click="refreshCatalog()"
            class="px-4 py-2 text-sm font-medium rounded-lg bg-cyan-500/15 text-cyan-400 hover:bg-cyan-500/25 transition"
            :disabled="refreshing">
      Refresh Catalog
    </button>
  </div>

  <!-- Two-panel layout -->
  <div x-show="!loading && models.length > 0" class="flex gap-4" style="height: calc(100vh - 200px);">

    <!-- ══ LEFT: Model Tree ═══════════════════════════════ -->
    <div class="w-64 flex-shrink-0 flex flex-col border border-white/[0.08] rounded-lg bg-slate-800/30 overflow-hidden">

      <!-- Search -->
      <div class="p-2 border-b border-white/[0.06]">
        <input type="text" x-model="filter" placeholder="Filter models/points..."
               class="form-control !py-1.5 !text-xs" @input.debounce.200ms="">
      </div>

      <!-- Model list -->
      <div class="flex-1 overflow-y-auto py-1">
        <template x-for="model in filteredModels" :key="model.model_id">
          <button @click="selectModel(model.model_id)"
                  class="w-full flex items-center gap-2 px-3 py-2 text-left hover:bg-slate-700/40 transition text-xs"
                  :class="selectedModelId === model.model_id ? 'bg-cyan-500/10 border-l-2 border-cyan-400' : 'border-l-2 border-transparent'">
            <span class="font-mono font-bold text-cyan-400 w-10 flex-shrink-0"
                  x-text="'M' + model.model_id"></span>
            <span class="text-slate-300 truncate flex-1" x-text="model.label"></span>
            <span class="text-slate-600 flex-shrink-0" x-text="model.points.length"></span>
          </button>
        </template>
      </div>
    </div>

    <!-- ══ RIGHT: Points Detail ═══════════════════════════ -->
    <div class="flex-1 flex flex-col border border-white/[0.08] rounded-lg bg-slate-800/30 overflow-hidden">

      <!-- No model selected -->
      <div x-show="!selectedModel" class="flex-1 flex items-center justify-center text-slate-600 text-sm">
        Select a model from the tree
      </div>

      <!-- Model header -->
      <div x-show="selectedModel" class="px-4 py-3 border-b border-white/[0.06] bg-slate-800/40">
        <div class="flex items-center gap-3">
          <span class="text-sm font-bold text-cyan-400 font-mono" x-text="'M' + (selectedModel?.model_id || '')"></span>
          <span class="text-sm font-semibold text-slate-200" x-text="selectedModel?.label || ''"></span>
          <div class="ml-auto flex items-center gap-3">
            <div class="flex items-center gap-1.5 text-[10px]">
              <span class="text-slate-600">Addr:</span>
              <button @click="addrMode = 'sunspec'"
                      class="px-1.5 py-0.5 rounded transition"
                      :class="addrMode === 'sunspec' ? 'bg-cyan-500/20 text-cyan-400' : 'text-slate-500 hover:text-slate-300'">SunSpec</button>
              <button @click="addrMode = 'base0'"
                      class="px-1.5 py-0.5 rounded transition"
                      :class="addrMode === 'base0' ? 'bg-amber-500/20 text-amber-400' : 'text-slate-500 hover:text-slate-300'">Base-0</button>
            </div>
            <span class="text-xs text-slate-500" x-text="(selectedModel?.points?.length || 0) + ' points'"></span>
          </div>
        </div>
      </div>

      <!-- Points table -->
      <div x-show="selectedModel" class="flex-1 overflow-auto">
        <table class="w-full text-xs">
          <thead class="sticky top-0 bg-slate-800 z-10">
            <tr class="border-b border-white/[0.08]">
              <th class="text-left px-3 py-2 text-slate-500 font-semibold uppercase tracking-wider">Point</th>
              <th class="text-left px-3 py-2 text-slate-500 font-semibold uppercase tracking-wider">Label</th>
              <th class="text-right px-3 py-2 text-slate-500 font-semibold uppercase tracking-wider">Value</th>
              <th class="text-left px-3 py-2 text-slate-500 font-semibold uppercase tracking-wider">Type</th>
              <th class="text-left px-3 py-2 text-slate-500 font-semibold uppercase tracking-wider">Unit</th>
              <th class="text-right px-3 py-2 text-slate-500 font-semibold uppercase tracking-wider">Addr</th>
              <th class="text-center px-3 py-2 text-slate-500 font-semibold uppercase tracking-wider">Access</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="pt in selectedModelPoints" :key="pt.name">
              <tr class="border-b border-white/[0.04] hover:bg-slate-700/20 transition"
                  :class="pt.name === 'ID' || pt.name === 'L' ? 'opacity-40' : ''">
                <td class="px-3 py-1.5 font-mono text-slate-300" x-text="pt.name"></td>
                <td class="px-3 py-1.5 text-slate-500 max-w-[180px] truncate" x-text="pt.label || ''"></td>
                <td class="px-3 py-1.5 text-right font-mono font-semibold">
                  <span :class="getPointValue(pt.name) != null ? 'text-cyan-300' : 'text-slate-700'"
                        x-text="formatPointValue(pt)"></span>
                </td>
                <td class="px-3 py-1.5 text-slate-600 font-mono" x-text="pt.type || ''"></td>
                <td class="px-3 py-1.5 text-slate-600" x-text="pt.unit || ''"></td>
                <td class="px-3 py-1.5 text-right text-slate-600 font-mono" x-text="formatAddress(pt.address)"></td>
                <td class="px-3 py-1.5 text-center">
                  <span class="px-1.5 py-0.5 rounded text-[10px] font-medium"
                        :class="pt.access === 'RW' ? 'bg-amber-500/20 text-amber-400' : 'bg-slate-700/50 text-slate-500'"
                        x-text="pt.access || 'R'"></span>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</div>
