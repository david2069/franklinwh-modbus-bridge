<!-- ── Settings Tab ─────────────────────────────────────── -->
<div x-data="settingsTab()">

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-4">

    <!-- MQTT Status -->
    <div class="card">
      <div class="card-label mb-3">MQTT Status</div>
      <div class="space-y-2 text-sm">
        <div class="flex justify-between">
          <span class="text-slate-500">Connection</span>
          <span class="font-medium" :class="mqtt.connected ? 'text-emerald-400' : 'text-red-400'"
                x-text="mqtt.connected ? 'Connected' : 'Disconnected'"></span>
        </div>
        <div class="flex justify-between">
          <span class="text-slate-500">Messages Sent</span>
          <span class="font-mono" x-text="mqtt.messages_sent ?? '--'"></span>
        </div>
        <div class="flex justify-between">
          <span class="text-slate-500">Discovery Published</span>
          <span class="font-medium" :class="mqtt.discovery_published ? 'text-emerald-400' : 'text-slate-500'"
                x-text="mqtt.discovery_published ? 'Yes' : 'No'"></span>
        </div>
        <div class="flex justify-between">
          <span class="text-slate-500">Entity Count</span>
          <span class="font-mono" x-text="mqtt.entity_count ?? '--'"></span>
        </div>
      </div>

      <!-- MQTT Actions -->
      <div class="flex gap-2 mt-4">
        <button @click="republishDiscovery()" class="btn btn-sm btn-primary">
          Republish Discovery
        </button>
        <button @click="unpublishDiscovery()" class="btn btn-sm btn-secondary">
          Unpublish
        </button>
      </div>
    </div>

    <!-- Poller Status -->
    <div class="card">
      <div class="card-label mb-3">Poller Status</div>
      <div class="space-y-2 text-sm">
        <div class="flex justify-between">
          <span class="text-slate-500">Status</span>
          <span class="font-medium" :class="poller.status === 'running' ? 'text-emerald-400' : 'text-amber-400'"
                x-text="poller.status || '--'"></span>
        </div>
        <div class="flex justify-between">
          <span class="text-slate-500">Polls Total</span>
          <span class="font-mono" x-text="poller.polls_total ?? '--'"></span>
        </div>
        <div class="flex justify-between">
          <span class="text-slate-500">Last Poll</span>
          <span class="font-mono text-xs" x-text="poller.last_poll_ts ? fmt.ago(poller.last_poll_ts) : 'never'"></span>
        </div>
        <div class="flex justify-between">
          <span class="text-slate-500">Last Error</span>
          <span class="font-mono text-xs text-red-400" x-text="poller.last_error || 'None'"></span>
        </div>
      </div>
    </div>

    <!-- Metrics Retention -->
    <div class="card">
      <div class="card-label mb-3">Metrics Storage</div>
      <div class="space-y-2 text-sm">
        <div class="flex justify-between items-center">
          <span class="text-slate-500">Retention (days)</span>
          <div class="flex items-center gap-2">
            <input type="number" x-model.number="metricsRetention" min="1" max="365" step="1"
                   class="form-control !py-1 !text-xs w-20 text-center">
            <button @click="saveMetricsRetention()"
                    class="btn btn-sm btn-primary">Save</button>
          </div>
        </div>
        <p class="text-[10px] text-slate-600">Power readings stored every 10s. Auto-purged hourly.</p>
      </div>
    </div>
  </div>

  <!-- Entity List -->
  <div class="card">
    <div class="flex items-center justify-between mb-3">
      <div class="card-label !mb-0">Entities (<span x-text="entities.length"></span>)</div>
      <input type="text" x-model="entityFilter" placeholder="Filter entities..."
             class="form-control w-48 !py-1 !text-xs">
    </div>

    <div class="max-h-[400px] overflow-y-auto">
      <table class="data-table">
        <thead class="sticky top-0 bg-slate-800">
          <tr>
            <th>Slug</th>
            <th>Name</th>
            <th>Type</th>
            <th>Value</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="e in filteredEntities" :key="e.slug">
            <tr>
              <td class="font-mono text-xs text-slate-400" x-text="e.slug"></td>
              <td class="text-xs" x-text="e.name"></td>
              <td><span class="text-xs px-1.5 py-0.5 rounded bg-slate-700 text-slate-400" x-text="e.ha_type"></span></td>
              <td class="font-mono text-xs text-cyan-300" x-text="getEntityValue(e.slug)"></td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </div>

</div>
