<!-- ── Sequencer Tab — sequence file management & execution ── -->
<div x-data="sequencerTab()">

  <!-- Loading -->
  <div x-show="loading" class="flex items-center gap-3 py-16 justify-center">
    <div class="loading-spinner"></div>
    <span class="text-sm text-slate-500">Loading sequences...</span>
  </div>

  <div x-show="!loading" class="flex gap-4" style="height: calc(100vh - 160px);">

    <!-- ══ LEFT: Sequence List ═══════════════════════════════ -->
    <div class="w-56 flex-shrink-0 flex flex-col border border-white/[0.08] rounded-lg bg-slate-800/30 overflow-hidden">

      <!-- Header + New button -->
      <div class="flex items-center justify-between px-3 py-2.5 border-b border-white/[0.06]">
        <span class="text-xs font-semibold uppercase text-slate-500 tracking-wider">Sequences</span>
        <button @click="showNewDialog = true"
                class="p-1 rounded hover:bg-slate-700 text-slate-400 hover:text-emerald-400 transition"
                title="New Sequence">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
      </div>

      <!-- File list -->
      <div class="flex-1 overflow-y-auto py-1">
        <template x-for="seq in sequences" :key="seq.name">
          <button @click="selectSequence(seq.name)"
                  class="w-full flex items-center gap-2 px-3 py-2 text-left hover:bg-slate-700/40 transition text-xs"
                  :class="selectedName === seq.name ? 'bg-amber-500/10 border-l-2 border-amber-400' : 'border-l-2 border-transparent'">
            <svg class="w-3.5 h-3.5 flex-shrink-0 text-amber-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
            </svg>
            <span class="text-slate-300 truncate flex-1" x-text="seq.name"></span>
            <span class="text-slate-600 text-[10px]" x-text="seq.steps + 's'"></span>
          </button>
        </template>
        <div x-show="sequences.length === 0" class="px-3 py-6 text-center text-slate-600 text-xs">
          No sequences yet
        </div>
      </div>
    </div>

    <!-- ══ CENTER: Editor ═══════════════════════════════════ -->
    <div class="flex-1 flex flex-col border border-white/[0.08] rounded-lg bg-slate-800/30 overflow-hidden">

      <!-- No selection -->
      <div x-show="!selectedName" class="flex-1 flex items-center justify-center text-slate-600 text-sm">
        Select a sequence or create a new one
      </div>

      <!-- Editor header -->
      <div x-show="selectedName" class="flex items-center gap-3 px-4 py-2.5 border-b border-white/[0.06] bg-slate-800/40">
        <!-- Name / rename -->
        <template x-if="!renameMode">
          <div class="flex items-center gap-2">
            <span class="text-sm font-semibold text-amber-400" x-text="selectedName"></span>
            <span x-show="editorDirty" class="text-[10px] text-amber-500">modified</span>
          </div>
        </template>
        <template x-if="renameMode">
          <div class="flex items-center gap-2">
            <input type="text" x-model="renameName" @keydown.enter="confirmRename()" @keydown.escape="renameMode = false"
                   class="form-control !py-0.5 !text-xs w-40" x-ref="renameInput">
            <button @click="confirmRename()" class="text-emerald-400 text-xs hover:underline">OK</button>
            <button @click="renameMode = false" class="text-slate-500 text-xs hover:underline">Cancel</button>
          </div>
        </template>

        <!-- Actions -->
        <div class="ml-auto flex items-center gap-2">
          <span class="text-[10px] text-slate-600" x-text="parsedStepCount + ' steps'"></span>
          <button @click="startRename()" class="p-1 rounded hover:bg-slate-700 text-slate-500 hover:text-slate-300 transition" title="Rename">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
          </button>
          <button @click="deleteSequence()" class="p-1 rounded hover:bg-slate-700 text-slate-500 hover:text-red-400 transition" title="Delete">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
          </button>
          <div class="w-px h-4 bg-white/[0.08]"></div>
          <button @click="saveSequence()" :disabled="saving || !editorDirty"
                  class="px-2.5 py-1 text-[10px] font-medium rounded bg-emerald-500/15 text-emerald-400 hover:bg-emerald-500/25 transition disabled:opacity-30">
            <span x-show="!saving">Save</span>
            <span x-show="saving">Saving...</span>
          </button>
          <label class="flex items-center gap-1.5 text-[10px] text-slate-500">
            <input type="checkbox" x-model="dryRun" class="rounded border-slate-600 bg-slate-700 w-3 h-3">
            Dry Run
          </label>
          <button @click="executeSequence()" :disabled="executing || !!validationError"
                  class="px-2.5 py-1 text-[10px] font-medium rounded bg-amber-500/15 text-amber-400 hover:bg-amber-500/25 transition disabled:opacity-30">
            <span x-show="!executing">Execute</span>
            <span x-show="executing" class="flex items-center gap-1">
              <span class="loading-spinner !w-3 !h-3"></span> Running
            </span>
          </button>
        </div>
      </div>

      <!-- Editor body -->
      <div x-show="selectedName" class="flex-1 flex flex-col overflow-hidden">
        <div class="flex-1 relative">
          <textarea x-model="editor" @input="onEditorInput()"
                    class="w-full h-full bg-slate-950 text-slate-300 font-mono text-xs p-4 resize-none border-0 focus:outline-none focus:ring-0"
                    spellcheck="false"></textarea>
        </div>
        <!-- Validation bar -->
        <div class="px-4 py-1.5 border-t border-white/[0.06] text-[10px]"
             :class="validationError ? 'text-red-400 bg-red-500/5' : 'text-emerald-400 bg-emerald-500/5'">
          <span x-text="validationError ? 'JSON Error: ' + validationError : 'Valid JSON (' + parsedStepCount + ' steps)'"></span>
        </div>
      </div>
    </div>

    <!-- ══ RIGHT: Output Terminal ═══════════════════════════ -->
    <div class="w-80 flex-shrink-0 flex flex-col border border-white/[0.08] rounded-lg bg-slate-800/30 overflow-hidden">
      <div class="px-3 py-2.5 border-b border-white/[0.06]">
        <span class="text-xs font-semibold uppercase text-slate-500 tracking-wider">Output</span>
      </div>
      <div class="flex-1 overflow-y-auto bg-slate-950 p-3 font-mono text-[11px] leading-relaxed">
        <template x-for="(line, i) in output" :key="i">
          <div :class="line.startsWith('ERROR') || line.startsWith('FAIL') ? 'text-red-400' :
                       line.startsWith('OK') || line.startsWith('PASS') || line.startsWith('SUCCESS') ? 'text-emerald-400' :
                       line.startsWith('STEP') || line.startsWith('>>>') || line.startsWith('---') ? 'text-cyan-400' :
                       line.startsWith('DRY') ? 'text-amber-400' :
                       line.includes('Skipping') ? 'text-slate-600' : 'text-slate-400'"
               x-text="line"></div>
        </template>
        <div x-show="output.length === 0" class="text-slate-600 italic text-xs">
          Select a sequence and click Execute to see output here...
        </div>
      </div>
    </div>

  </div>

  <!-- New Sequence Dialog -->
  <div x-show="showNewDialog" x-cloak
       class="fixed inset-0 z-[100] flex items-center justify-center p-4"
       @keydown.escape.window="showNewDialog = false">
    <div class="absolute inset-0 bg-black/60" @click="showNewDialog = false"></div>
    <div class="relative bg-slate-800 border border-white/[0.1] rounded-xl shadow-2xl w-full max-w-sm p-5"
         x-transition>
      <h3 class="text-sm font-semibold text-slate-200 mb-4">New Sequence</h3>
      <input type="text" x-model="newName" placeholder="sequence_name"
             class="form-control !text-sm mb-4"
             @keydown.enter="createSequence()">
      <div class="flex justify-end gap-2">
        <button @click="showNewDialog = false" class="btn btn-sm btn-secondary">Cancel</button>
        <button @click="createSequence()" class="btn btn-sm btn-primary" :disabled="!newName.trim()">Create</button>
      </div>
    </div>
  </div>

</div>
