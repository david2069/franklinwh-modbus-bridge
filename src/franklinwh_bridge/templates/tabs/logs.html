<!-- ── Logs Tab — filterable log viewer with pagination ── -->
<div x-data="logsTab()">

  <!-- Sub-tabs (owner, 2026-10-30): the app log, the battery-control writes and
       the daily health report (#296 item 51) each get the full page.
       ?tab=logs&section=app|writes|health. Writes are admin only. -->
  <div class="flex flex-wrap items-center gap-1 mb-3 border-b border-white/[0.08]" role="tablist">
    <template x-for="t in [['app', 'App log'], ['writes', 'Battery-control writes'], ['health', 'Health']]
                         .filter(t => t[0] !== 'writes' || $store.app.isAdmin)" :key="t[0]">
      <button type="button" role="tab"
              :data-testid="'logs-section-' + t[0]"
              :aria-selected="$store.app.logsSection === t[0]"
              @click="$store.app.setLogsSection(t[0])"
              class="px-3 py-1.5 text-xs font-medium border-b-2 transition" style="margin-bottom: -1px"
              :class="$store.app.logsSection === t[0]
                ? 'border-cyan-400 text-cyan-300'
                : 'border-transparent text-slate-400 hover:text-slate-200'"
              x-text="t[1]"></button>
    </template>
  </div>

  <div x-show="$store.app.logsSection === 'app' || ($store.app.logsSection === 'writes' && !$store.app.isAdmin)"
       data-testid="logs-app">

  <!-- Level totals as one row of tappable chips. As cards these were five
       ~130px boxes around a single digit — ~270px of chrome on a phone before
       any log was visible, and four of the five read 0 nearly always. -->
  <div class="flex flex-wrap gap-1.5 mb-3">
    <template x-for="lvl in levels" :key="lvl.name">
      <!-- A count of 0 recedes; anything non-zero is tinted and keeps full
           contrast, so an ERROR still catches the eye at chip size. -->
      <button @click="toggleLevelFilter(lvl.name)"
              class="flex items-center gap-1.5 px-2.5 py-1 rounded-full border text-[11px] transition hover:opacity-80"
              :class="[
                levelFilter === lvl.name ? 'border-current ring-1 ring-current' : 'border-white/10',
                (summary[lvl.name] ?? 0) > 0 ? lvl.chipBg : 'opacity-55'
              ]"
              :title="'Filter to ' + lvl.name">
        <span class="uppercase tracking-wide" :class="(summary[lvl.name] ?? 0) > 0 ? lvl.color : 'text-slate-500'"
              x-text="lvl.name"></span>
        <span class="font-mono font-semibold" :class="(summary[lvl.name] ?? 0) > 0 ? lvl.color : 'text-slate-500'"
              x-text="summary[lvl.name] ?? 0"></span>
      </button>
    </template>
  </div>

  <!-- Filter bar -->
  <div class="card !p-3 mb-4">
    <!-- Search always visible; the rest collapses behind a toggle on a phone.
         `hidden sm:flex` keeps desktop exactly as it was, toggle and all. -->
    <div class="flex items-center gap-2">
      <div class="flex-1 min-w-0">
        <input type="text" x-model="searchQuery" placeholder="Search messages..."
               class="form-control !py-1.5 !text-xs" @input.debounce.300ms="loadLogs()">
      </div>
      <button @click="filtersOpen = !filtersOpen"
              class="sm:hidden btn btn-sm btn-secondary whitespace-nowrap !py-1.5 !text-xs"
              :aria-expanded="filtersOpen">
        Filters<span x-show="activeFilterCount"
                     class="ml-1 px-1.5 rounded-full bg-cyan-500/20 text-cyan-300"
                     x-text="activeFilterCount"></span>
      </button>
    </div>
    <div class="items-center gap-3 flex-wrap mt-2 sm:mt-3"
         :class="filtersOpen ? 'flex' : 'hidden sm:flex'">
      <!-- Level filter -->
      <select x-model="levelFilter" @change="loadLogs()" class="form-control !py-1.5 !text-xs w-28">
        <option value="">All Levels</option>
        <option value="DEBUG">DEBUG</option>
        <option value="INFO">INFO</option>
        <option value="WARNING">WARNING</option>
        <option value="ERROR">ERROR</option>
        <option value="CRITICAL">CRITICAL</option>
      </select>
      <!-- Gateway filter -->
      <select x-model="gatewayFilter" @change="page = 0" class="form-control !py-1.5 !text-xs w-28"
              x-show="$store.app.multiGateway">
        <option value="">All Gateways</option>
        <template x-for="gw in $store.app.gatewayList" :key="'log-' + gw.id">
          <option :value="gw.id" x-text="gw.name"></option>
        </template>
      </select>
      <!-- Source filter -->
      <select x-model="sourceFilter" @change="page = 0" class="form-control !py-1.5 !text-xs w-48">
        <option value="">All Sources</option>
        <template x-for="s in availableSources" :key="'src-' + s">
          <option :value="s" x-text="shortSource(s)"></option>
        </template>
      </select>
      <!-- Time range (server-side, over persisted logs) -->
      <select x-model="rangePreset" @change="rangePreset === 'custom' ? null : setRange(rangePreset)"
              class="form-control !py-1.5 !text-xs w-32" title="Time span">
        <option value="1h">Last 1h</option>
        <option value="6h">Last 6h</option>
        <option value="24h">Last 24h</option>
        <option value="7d">Last 7 days</option>
        <option value="30d">Last 30 days</option>
        <option value="all">All time</option>
        <option value="custom">Custom…</option>
      </select>
      <template x-if="rangePreset === 'custom'">
        <span class="flex items-center gap-1.5">
          <input type="datetime-local" x-model="customStart" class="form-control !py-1 !text-xs">
          <span class="text-slate-500 text-xs">→</span>
          <input type="datetime-local" x-model="customEnd" class="form-control !py-1 !text-xs">
          <span class="text-slate-500 text-[10px]" x-text="fmt.tz()"></span>
          <button @click="applyCustomRange()" class="px-2 py-1 text-xs rounded bg-cyan-600 text-white hover:bg-cyan-500">Apply</button>
        </span>
      </template>
      <!-- Auto-refresh toggle -->
      <label class="flex items-center gap-1.5 text-xs text-slate-400 cursor-pointer select-none">
        <input type="checkbox" x-model="autoRefresh" class="accent-cyan-500"
               @change="autoRefresh ? startAutoRefresh() : stopAutoRefresh()">
        Auto
      </label>
      <!-- Refresh -->
      <button @click="loadLogs()" class="px-3 py-1.5 text-xs font-medium rounded bg-slate-700 text-slate-300 hover:bg-slate-600 transition">
        Refresh
      </button>
      <!-- Export (#320): the filter above, as a file; serials and IPs masked.
           Admin only, as the log can name hosts and users. -->
      <span x-show="$store.app.isAdmin" class="flex items-center gap-1.5">
        <button @click="exportLogs('text')" data-testid="logs-export-text"
                class="px-3 py-1.5 text-xs font-medium rounded bg-slate-700 text-slate-300 hover:bg-slate-600 transition"
                title="Download the log lines this filter shows, as text. Serials and IP addresses are masked.">
          Export text
        </button>
        <button @click="exportLogs('json')" data-testid="logs-export-json"
                class="px-3 py-1.5 text-xs font-medium rounded bg-slate-700 text-slate-300 hover:bg-slate-600 transition"
                title="Download the log lines this filter shows, as JSON. Serials and IP addresses are masked.">
          Export JSON
        </button>
      </span>
    </div>
  </div>

  <!-- Loading -->
  <div x-show="loading" class="flex items-center gap-3 py-8 justify-center">
    <div class="loading-spinner"></div>
    <span class="text-sm text-slate-500">Loading logs...</span>
  </div>

  <!-- Log table -->
  <div x-show="!loading" class="card !p-0 overflow-hidden">
    <div class="overflow-auto" style="max-height: calc(100vh - 360px);">
      <table class="w-full text-xs">
        <thead class="sticky top-0 bg-slate-800 z-10">
          <tr class="border-b border-white/[0.08]">
            <!-- Time + message carry the log; level is a colour cue on the
                 message itself when the chip column is dropped, and source
                 folds under the message on a phone. -->
            <th class="text-left px-3 py-2 text-slate-500 font-semibold w-20 sm:w-32">TIME <span class="font-normal normal-case" x-text="'(' + fmt.tz() + ')'"></span></th>
            <th class="hidden sm:table-cell text-left px-3 py-2 text-slate-500 font-semibold w-20">LEVEL</th>
            <th class="hidden lg:table-cell text-left px-3 py-2 text-slate-500 font-semibold w-40">SOURCE</th>
            <th class="text-left px-3 py-2 text-slate-500 font-semibold">MESSAGE</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="(entry, idx) in paginatedLogs" :key="idx">
            <tr class="border-b border-white/[0.04] hover:bg-slate-700/20 transition">
              <td class="px-3 py-1.5 font-mono text-slate-500 whitespace-nowrap" :title="fmt.at(entry.ts)">
                <span class="sm:hidden" x-text="fmt.short(entry.ts)"></span>
                <span class="hidden sm:inline" x-text="formatTs(entry.ts)"></span>
              </td>
              <td class="hidden sm:table-cell px-3 py-1.5">
                <span class="chip text-[10px]"
                      :class="levelChipClass(entry.level)"
                      x-text="entry.level"></span>
              </td>
              <td class="hidden lg:table-cell px-3 py-1.5 font-mono text-slate-500 truncate max-w-[200px]"
                  :title="entry.name" x-text="shortSource(entry.name)"></td>
              <td class="px-3 py-1.5 font-mono text-slate-300"
                  :class="entry.level === 'ERROR' || entry.level === 'CRITICAL' ? 'text-red-400' :
                          entry.level === 'WARNING' ? 'text-amber-400' : ''">
                <span x-text="entry.message"></span>
                <span class="lg:hidden block text-[10px] text-slate-600 truncate" x-text="shortSource(entry.name)"></span>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="flex items-center justify-between px-4 py-2 border-t border-white/[0.08] bg-slate-800/50">
      <span class="text-xs text-slate-500" x-text="filteredLogs.length + ' entries'"></span>
      <div class="flex items-center gap-2">
        <button @click="prevPage()" :disabled="page === 0"
                class="px-2 py-1 text-xs rounded bg-slate-700 text-slate-400 hover:bg-slate-600 disabled:opacity-30 transition">
          Prev
        </button>
        <span class="text-xs text-slate-500" x-text="(page + 1) + ' / ' + totalPages"></span>
        <button @click="nextPage()" :disabled="page >= totalPages - 1"
                class="px-2 py-1 text-xs rounded bg-slate-700 text-slate-400 hover:bg-slate-600 disabled:opacity-30 transition">
          Next
        </button>
        <select x-model.number="pageSize" @change="page = 0" class="form-control !py-1 !text-[10px] w-16">
          <option value="50">50</option>
          <option value="100">100</option>
          <option value="200">200</option>
          <option value="500">500</option>
        </select>
      </div>
    </div>
  </div>
  </div>

  <!-- Modbus write audit trail (#342): every SunSpec write, as sent and as
       answered. Admin only; downloads go through fetch + Blob so they work
       under HA ingress, where there is no address bar. -->
  <div x-show="$store.app.isAdmin && $store.app.logsSection === 'writes'" x-data="modbusWrites()"
       x-effect="$store.app.isAdmin && $store.app.logsSection === 'writes' && load()"
       class="card !p-0 overflow-hidden" data-testid="modbus-writes">
    <div class="flex flex-wrap items-center gap-2 px-4 py-3 border-b border-white/[0.06]">
      <h3 class="text-xs font-semibold uppercase tracking-wide text-slate-400">Battery-control writes</h3>
      <span class="text-[11px] text-slate-500">every Modbus write the bridge sent, and the aGate's reply</span>
      <div class="ml-auto flex items-center gap-2">
        <button @click="load()" class="px-2 py-1 text-xs rounded bg-slate-700 text-slate-300 hover:bg-slate-600">Refresh</button>
        <button @click="download('csv')" class="px-2 py-1 text-xs rounded bg-slate-700 text-slate-300 hover:bg-slate-600"
                data-testid="modbus-writes-csv">Download CSV</button>
        <button @click="download('json')" class="px-2 py-1 text-xs rounded bg-slate-700 text-slate-300 hover:bg-slate-600">Download JSON</button>
      </div>
    </div>
    <div x-show="error" class="px-4 py-3 text-xs text-red-400" x-text="error"></div>
    <div x-show="!error && rows.length === 0" class="px-4 py-3 text-xs text-slate-500">No writes recorded yet.</div>
    <div x-show="rows.length > 0" class="overflow-auto" style="max-height: calc(100vh - 260px);">
      <table class="w-full text-xs font-mono">
        <thead class="text-slate-500 text-[10px] uppercase">
          <tr>
            <th class="text-left px-4 py-2">Time <span class="normal-case" x-text="'(' + fmt.tz() + ')'"></span></th>
            <th class="text-left px-2 py-2">Gateway</th>
            <th class="text-left px-2 py-2">Register</th>
            <th class="text-left px-2 py-2">Raw values</th>
            <th class="text-left px-2 py-2">aGate reply</th>
            <th class="text-left px-2 py-2">Sent by</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="r in rows" :key="r.id">
            <tr class="border-t border-white/[0.04]">
              <td class="px-4 py-1.5 whitespace-nowrap" x-text="stamp(r.ts)"></td>
              <td class="px-2 py-1.5 whitespace-nowrap" data-testid="write-gateway" :title="r.gateway_id">
                <span x-text="gw(r.gateway_id).name"></span>
                <span x-show="gw(r.gateway_id).serial" class="block text-[10px] text-slate-500"
                      x-text="gw(r.gateway_id).serial"></span>
              </td>
              <td class="px-2 py-1.5 whitespace-nowrap" x-text="regLabel(r.address)"></td>
              <td class="px-2 py-1.5" x-text="'[' + r.values.join(', ') + ']'"></td>
              <td class="px-2 py-1.5" :class="r.result === 'ok' ? 'text-green-400' : 'text-red-400'"
                  x-text="r.result === 'ok' ? 'OK' : r.detail"></td>
              <td class="px-2 py-1.5 text-slate-400 whitespace-nowrap" x-text="r.initiator"></td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Health (#296 item 51): the daily bridge-health report (07:00 site time) and the
       weekly battery report (Monday 07:00). logs_tab.js healthReport(). -->
  <div x-show="$store.app.logsSection === 'health'" x-data="healthReport()"
       x-effect="$store.app.activeTab === 'logs' && $store.app.logsSection === 'health' && load()"
       data-testid="health-report">
    <div class="flex gap-1 mb-3" role="tablist" aria-label="Report">
      <template x-for="k in [['daily', 'Daily'], ['weekly', 'Weekly battery']]" :key="k[0]">
        <button type="button" role="tab" :aria-selected="kind === k[0]" @click="setKind(k[0])"
                :data-testid="'health-kind-' + k[0]"
                class="px-3 py-1 rounded-full text-xs font-semibold transition"
                :class="kind === k[0] ? 'bg-slate-700 text-cyan-400' : 'text-slate-400 hover:text-slate-200'"
                x-text="k[1]"></button>
      </template>
    </div>
    <div class="card mb-4">
      <div class="flex flex-wrap items-start gap-3">
        <span x-show="current" class="px-2.5 py-1 rounded-full text-xs font-semibold uppercase tracking-wide shrink-0"
              :style="`color:${lv.fg};background:${lv.bg}`" :data-level="current && current.level"
              data-testid="health-level" x-text="lv.label"></span>
        <div class="min-w-0" style="flex:1 1 220px">
          <div class="text-sm font-semibold break-words" style="color:var(--text-primary)" data-testid="health-headline"
               x-text="current ? headline : (loaded ? 'No report yet' : 'Loading…')"></div>
          <div class="text-[11px] text-slate-500 mt-0.5">
            <span x-show="current" x-text="current && (stamp(current.ts) + ' ' + bridgeTime.label() + ' · '
                  + (r && r.kind === 'weekly' ? 'week ' + weekLabel(r.week) : 'last 24 hours against the 7 days before'))"></span>
            <span x-show="loaded && !current" x-text="kind === 'weekly' ? `The first one is made on ${weeklyAt} (site time), for the week before.`
                                                                       : `The first report is made at ${dailyAt} (site time).`"></span>
          </div>
        </div>
        <select x-show="past.length > 1" x-model="pick" @change="show(pick)" aria-label="Past reports"
                class="form-control !py-1 !text-xs" style="width:auto;max-width:100%" data-testid="health-past">
          <template x-for="p in past" :key="p.id">
            <option :value="String(p.id)" x-text="pastLabel(p)"></option>
          </template>
        </select>
      </div>
      <ul x-show="r && r.reasons.length > 1" class="mt-3 space-y-1 text-xs text-slate-300 list-disc pl-5" data-testid="health-reasons">
        <template x-for="(why, i) in (r ? r.reasons.slice(1) : [])" :key="i">
          <li class="break-words" x-text="why"></li>
        </template>
      </ul>
      <div x-show="$store.app.isAdmin" class="mt-3 pt-3 border-t border-white/[0.06] flex flex-wrap items-center gap-3 text-xs">
        <button type="button" @click="runNow()" :disabled="busy" class="btn btn-sm btn-secondary"
                data-testid="health-run">Run now</button>
        <label class="flex items-center gap-2 text-slate-400">
          <button type="button" role="switch" :aria-checked="on" @click="setOn(!on)"
                  :aria-label="(on ? 'Turn off: ' : 'Turn on: ') + name" data-testid="health-daily"
                  class="relative inline-flex h-6 items-center rounded-full transition shrink-0" style="width:44px"
                  :class="on ? 'bg-emerald-500' : 'bg-slate-600'">
            <span class="inline-block h-5 w-5 rounded-full bg-white transition"
                  :style="on ? 'transform:translateX(21px)' : 'transform:translateX(2px)'"></span>
          </button>
          <span x-text="kind === 'weekly' ? `${name}, ${at}` : `${name} at ${at}`"></span>
        </label>
        <span class="text-slate-500" x-text="note" data-testid="health-note"></span>
      </div>
      <div x-show="error" class="mt-2 text-xs text-red-400" x-text="error"></div>
    </div>

    <template x-if="r && r.kind === 'daily'">
      <div class="grid gap-4" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))">
        <!-- Workers -->
        <div class="card" data-testid="health-workers">
          <h3 class="text-xs font-semibold uppercase tracking-wide text-slate-400 mb-2">Workers</h3>
          <div class="text-xs text-slate-300 space-y-1">
            <div x-text="`${r.workers.count} background tasks; ${r.workers.broken.length + r.workers.stale.length ? 'not all running' : 'all running'}`"></div>
            <div x-show="r.workers.broken.length" class="text-red-400" x-text="'Crashed: ' + r.workers.broken.join(', ')"></div>
            <div x-show="r.workers.stale.length" class="text-red-400" x-text="'Stopped beating: ' + r.workers.stale.join(', ')"></div>
            <div class="text-slate-400" x-text="`Bridge starts in 24 h: ${r.workers.restarts}`"></div>
          </div>
        </div>

        <!-- Alerts -->
        <div class="card" data-testid="health-alerts">
          <h3 class="text-xs font-semibold uppercase tracking-wide text-slate-400 mb-2">Alerts</h3>
          <div class="text-xs space-y-1">
            <div x-show="!r.alerts.open.length" class="text-slate-400">None open.</div>
            <template x-for="a in r.alerts.open" :key="a.id">
              <div :class="a.severity === 'critical' ? 'text-red-400' : 'text-amber-400'"
                   x-text="`Open: ${a.title}${a.gateway ? ' (' + a.gateway + ')' : ''} since ${stamp(a.opened_ts)}`"></div>
            </template>
            <div class="text-slate-400 pt-1" x-text="r.alerts.raised.length ? 'Raised in 24 h:' : 'None raised in 24 h.'"></div>
            <template x-for="a in r.alerts.raised" :key="a.code">
              <div class="text-slate-300" x-text="`${a.title}: ${a.repeats}`"></div>
            </template>
          </div>
        </div>

        <!-- Housekeeping -->
        <div class="card" data-testid="health-housekeeping">
          <h3 class="text-xs font-semibold uppercase tracking-wide text-slate-400 mb-2">Housekeeping</h3>
          <div class="text-xs text-slate-300 space-y-1">
            <div x-text="'Database: ' + bytes(r.housekeeping.db_bytes)"></div>
            <div x-text="'Log rows kept: ' + (r.housekeeping.log_rows ?? '–')"></div>
            <div x-text="'Last backup: ' + ago(r.housekeeping.last_backup_ts)"></div>
          </div>
        </div>
      </div>
    </template>

    <template x-if="r && r.kind === 'daily'">
      <div>
        <!-- Gateway link -->
        <div class="card !p-0 overflow-hidden mt-4" data-testid="health-link">
          <h3 class="text-xs font-semibold uppercase tracking-wide text-slate-400 px-4 pt-3 pb-2">Gateway link, last 24 h</h3>
          <div x-show="!r.link.length" class="px-4 pb-3 text-xs text-slate-500">No gateway configured.</div>
          <div x-show="r.link.length" class="overflow-x-auto">
            <table class="w-full text-xs">
              <thead class="text-slate-500 text-[10px] uppercase">
                <tr>
                  <th class="text-left px-4 py-1.5">Gateway</th>
                  <th class="text-right px-2 py-1.5">Requests</th>
                  <th class="text-right px-2 py-1.5">Failed</th>
                  <th class="text-right px-2 py-1.5">Reconnects</th>
                  <th class="text-right px-2 py-1.5">Retries</th>
                  <th class="text-right px-4 py-1.5" title="Longest run of failed polls">Longest fail run</th>
                </tr>
              </thead>
              <tbody class="font-mono">
                <template x-for="g in r.link" :key="g.gateway">
                  <tr class="border-t border-white/[0.04]">
                    <td class="px-4 py-1.5 font-sans whitespace-nowrap" x-text="g.name"></td>
                    <td class="text-right px-2 py-1.5" x-text="g.requests"></td>
                    <td class="text-right px-2 py-1.5 whitespace-nowrap" :class="(g.failed_share || 0) >= 0.05 ? 'text-amber-400' : ''"
                        x-text="`${g.failed} (${pct(g.failed_share)})`"></td>
                    <td class="text-right px-2 py-1.5" x-text="g.reconnects"></td>
                    <td class="text-right px-2 py-1.5" x-text="g.lib_retries"></td>
                    <td class="text-right px-4 py-1.5" x-text="g.max_consec_fail"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Log patterns -->
        <div class="card !p-0 overflow-hidden mt-4" data-testid="health-logs">
          <h3 class="text-xs font-semibold uppercase tracking-wide text-slate-400 px-4 pt-3 pb-1">Warnings and errors, last 24 h</h3>
          <p class="px-4 pb-2 text-[11px] text-slate-500"
             x-text="`${r.logs.warnings} warnings and ${r.logs.errors} errors, in ${r.logs.pattern_count} kinds of message (numbers and addresses taken out). New: not seen in the 7 days before. Growing: more than twice the daily average. All day: in 20 or more of the 24 hours.`"></p>
          <div x-show="!r.logs.patterns.length" class="px-4 pb-3 text-xs text-slate-500">None.</div>
          <template x-for="(p, i) in r.logs.patterns" :key="i">
            <div class="px-4 py-2 border-t border-white/[0.04] text-xs" data-testid="health-pattern">
              <div class="flex flex-wrap items-center gap-2">
                <span class="font-mono font-semibold" :class="p.level === 'ERROR' ? 'text-red-400' : 'text-amber-400'"
                      x-text="`${p.count} ×`"></span>
                <span class="text-[10px] uppercase text-slate-500" x-text="p.level"></span>
                <template x-for="f in p.flags" :key="f">
                  <span class="px-1.5 rounded-full text-[10px] font-semibold" style="color:#fbbf24;background:rgba(245,158,11,0.15)" x-text="f"></span>
                </template>
                <span class="text-[11px] text-slate-500" x-text="`${p.per_hour} an hour over ${p.hours} h · 7 days before: ${p.prior_7d}`"></span>
              </div>
              <div class="mt-1 text-slate-300 break-words" x-text="p.example"></div>
              <div class="text-[10px] text-slate-500 font-mono break-all" x-text="p.logger + ' · last ' + stamp(p.last_ts)"></div>
            </div>
          </template>
        </div>
      </div>
    </template>

    <!-- Weekly battery report: one card per gateway. -->
    <template x-if="r && r.kind === 'weekly'">
      <div class="grid gap-4" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))">
        <template x-for="g in r.gateways" :key="g.gateway">
          <div class="card" data-testid="health-weekly-gateway">
            <h3 class="text-xs font-semibold uppercase tracking-wide text-slate-400 mb-2" x-text="g.name"></h3>
            <div x-show="g.snapshots < 2" class="text-xs text-slate-500 mb-2"
                 x-text="`${g.snapshots} daily snapshot${g.snapshots === 1 ? '' : 's'} in this week: the energy figures need two. The snapshot is taken just after midnight.`"></div>
            <table class="w-full text-xs">
              <tbody>
                <tr><td class="py-1 text-slate-400">State of health</td>
                    <td class="py-1 text-right font-mono" data-testid="health-weekly-soh" x-text="n(g.soh.now, '%')"></td></tr>
                <tr><td class="py-1 text-slate-400 pl-3">a week before · 4 weeks · a year</td>
                    <td class="py-1 text-right font-mono" x-text="`${n(g.soh.week_ago, '%')} · ${n(g.soh.four_weeks_ago, '%')} · ${n(g.soh.year_ago, '%')}`"></td></tr>
                <tr><td class="py-1 text-slate-400 pl-3">trend, per month</td>
                    <td class="py-1 text-right font-mono" x-text="g.soh.per_month === null ? 'needs 4 weeks' : (g.soh.per_month > 0 ? '+' : '') + g.soh.per_month + ' points'"></td></tr>
                <tr><td class="py-1 text-slate-400">Capacity rated · available now</td>
                    <td class="py-1 text-right font-mono" x-text="`${n(g.capacity.rated_kwh, ' kWh')} · ${n(g.capacity.available_kwh, ' kWh')}`"></td></tr>
                <tr><td class="py-1 text-slate-400">Round-trip efficiency</td>
                    <td class="py-1 text-right font-mono" data-testid="health-weekly-eff"
                        x-text="g.efficiency ? g.efficiency.pct + '%' : 'no span with matching charge'"></td></tr>
                <tr x-show="g.efficiency"><td class="py-1 text-slate-400 pl-3" colspan="2"
                    x-text="g.efficiency && `${g.efficiency.out_kwh} kWh out ÷ ${g.efficiency.in_kwh} kWh in, ${g.efficiency.from} to ${g.efficiency.to} (SoC ${g.efficiency.soc_from}% and ${g.efficiency.soc_to}%)`"></td></tr>
                <tr><td class="py-1 text-slate-400">Equivalent full cycles, week · lifetime</td>
                    <td class="py-1 text-right font-mono" x-text="`${n(g.full_cycles.week)} · ${n(g.full_cycles.lifetime)}`"></td></tr>
                <tr><td class="py-1 text-slate-400">Charge cycles (from SoC)</td>
                    <td class="py-1 text-right font-mono" x-text="g.cycles.cycles + (g.cycles.mean_depth !== null ? `, ${g.cycles.mean_depth} points deep on average` : '')"></td></tr>
                <tr><td class="py-1 text-slate-400 pl-3" colspan="2"
                    x-text="'By depth: ' + Object.entries(g.cycles.bands).map(([k, v]) => `${k}: ${v}`).join(' · ')"></td></tr>
              </tbody>
            </table>
            <template x-if="g.energy">
              <div class="mt-3 pt-2 border-t border-white/[0.06]">
                <div class="text-[10px] uppercase tracking-wider text-slate-500 font-semibold mb-1"
                     x-text="`Energy, ${g.energy.from} to ${g.energy.to} (${g.energy.days} days), as the aGate counts it`"></div>
                <table class="w-full text-xs">
                  <tbody class="font-mono">
                    <template x-for="row in [['Battery in', g.energy.battery_in_kwh], ['Battery out', g.energy.battery_out_kwh],
                                             ['Solar', g.energy.solar_kwh], ['Grid import', g.energy.grid_import_kwh],
                                             ['Grid export', g.energy.grid_export_kwh], ['Inverter AC out', g.energy.inverter_out_kwh],
                                             ['Inverter AC in', g.energy.inverter_in_kwh]]" :key="row[0]">
                      <tr><td class="py-0.5 text-slate-400 font-sans" x-text="row[0]"></td>
                          <td class="py-0.5 text-right" x-text="n(row[1], ' kWh')"></td></tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </template>
          </div>
        </template>
        <div x-show="!r.gateways.length" class="card text-xs text-slate-500">No gateway configured.</div>
      </div>
    </template>
  </div>

</div>
