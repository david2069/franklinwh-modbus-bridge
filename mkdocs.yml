site_name: FranklinWH Modbus Bridge
site_description: Home Assistant add-on and Docker bridge for FranklinWH aGates over Modbus TCP — dashboards, scheduler, MQTT entities
site_url: https://david2069.github.io/franklinwh-modbus-bridge
repo_url: https://github.com/david2069/franklinwh-modbus-bridge
repo_name: david2069/franklinwh-modbus-bridge

theme:
  name: material
  palette:
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.mark
  - pymdownx.keys
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/david2069/franklinwh-modbus-bridge
      name: Source on GitHub
    - icon: fontawesome/solid/comments
      link: https://github.com/david2069/franklinwh-modbus-bridge/discussions
      name: Discussions — ask anything
    - icon: fontawesome/solid/bug
      link: https://github.com/david2069/franklinwh-modbus-bridge/issues
      name: Issues

# Design notes and internal reference stay in docs/ for the repo but are not
# part of the user site.
exclude_docs: |
  /*.md
  !/index.md
  !/install-lifecycle.md
  !/issue-policy.md
  !/security.md
  !/admin-recovery.md
  !/restarts-and-shutdown.md
  /reference/
  _*.py

nav:
