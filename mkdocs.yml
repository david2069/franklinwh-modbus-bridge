    - Concepts: user/scheduler/concepts.md
    - Triggers: user/scheduler/triggers.md
    - Conditions: user/scheduler/conditions.md
    - Actions: user/scheduler/actions.md
    - Targets: user/scheduler/targets.md
    - Exit and release: user/scheduler/exit-and-conflicts.md
    - Priorities and conflicts: user/scheduler/priorities.md
    - Outcomes and audit: user/scheduler/outcomes.md
    - Restarts and the clock: user/scheduler/restarts-and-clock.md
    - Dependencies and troubleshooting: user/scheduler/dependencies.md
    - Examples: user/scheduler/examples.md
  - Home Assistant:
    - "Setup: instance & notifications": user/ha-setup.md
    - Alerts and health sensors: user/alerts.md
    - Fixing, moving and removing entities: user/home-assistant-entities.md
    - "Phone, notifications & remote access": user/phone-and-remote-access.md
  - Developer Guide:
    - dev/index.md
    - REST API & OpenAPI: dev/rest-api.md
    - API reference: dev/api-reference.md
    - How the Web UI uses the API: dev/web-ui.md
    - "Data out: MQTT to Home Assistant": dev/mqtt.md
