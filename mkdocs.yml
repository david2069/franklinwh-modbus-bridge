  - Help & Community:
    - "Discussions — ask anything": https://github.com/david2069/franklinwh-modbus-bridge/discussions
    - Issues: https://github.com/david2069/franklinwh-modbus-bridge/issues
  - Getting Started:
    - Install (HA add-on): user/install-addon.md
    - Install (Docker): user/install-docker.md
    - Install (Python): user/install-python.md
    - First run & setup wizard: user/setup-wizard.md
    - "Battery dispatch: best practice": user/battery-dispatch-best-practice.md
  - Dashboards & Settings:
    - Overview: user/ui/index.md
    - Top bar: user/ui/top-bar.md
    - Colours: user/ui/colours.md
    - Dashboard: user/ui/dashboard.md
    - Battery controls: user/ui/controls.md
    - SunSpec Explorer: user/ui/sunspec-explorer.md
    - Sequencer: user/ui/sequencer.md
    - Logs: user/ui/logs.md
    - Home Assistant page: user/ui/home-assistant-page.md
    - Energy Costs: user/ui/energy-costs.md
    - Simple dashboard (/user): user/ui/user-dashboard.md
    - "Settings: Site & Gateways": user/ui/settings-site-gateways.md
    - "Settings: Home Assistant": user/ui/settings-home-assistant.md
    - "Settings: Energy & Automation": user/ui/settings-energy-automation.md
    - "Settings: Data & Backup": user/ui/settings-data-backup.md
    - "Settings: Admin": user/ui/settings-admin.md
    - "Guide: location, weather & solar forecast": user/ui/guide-location-weather.md
    - "Guide: utility, meter & tariff setup": user/ui/guide-utility-tariffs.md
  - Scheduler:
